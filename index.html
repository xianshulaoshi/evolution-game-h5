e",commonName:"代表生物：亚辟猴",era:"渐新世",geologicalPeriod:"渐新世",eraYears:"约 3020-2950 万年前",description:"副猿科（Parapithecidae）代表非洲高等灵长类最古老的一支——比狭鼻/阔鼻猴分化更早。它保留 3.1.3.3 齿式（与新世界猴同）、树栖跳跃、群居果食。副猿的存在提示：新世界猴或许并非唯一保留原始齿式的类群，而是与更古老的干群共享祖征。",shortBio:"渐新世非洲 · 副猿 —— 高等灵长类最古老一支，3.1.3.3 齿式与新世界猴共享祖征。"},prerequisites:["node_simian"],nextNodeId:"",extinctionNarrative:"亚辟猴是渐新世非洲的早期类人猴，猫一般大小。它属于灵长类演化早期的旁支，热闹一时后便退出了历史。"},node_sivapithecus:{id:"node_sivapithecus",type:"extinction",era:5,eraName:"中新世",geologicalPeriod:"中新世",yearsAgo:"约 1250-850 万年前",requiredTime:1440,species:{taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲",order:"灵长目",family:"人科",genus:"西瓦古猿属"},imagePath:"images/processed/Sivapithecus_indicus.jpg",imageWidth:0,imageHeight:0,keyInnovations:["猩猩干群","巨大门齿","厚牙釉质","亚洲人科"],isExtinct:!0,animationCategory:"extinct",id:"species_sivapithecus_indicus",scientificName:"Sivapithecus indicus",commonName:"代表生物：西瓦古猿",era:"中新世",geologicalPeriod:"中新世",eraYears:"约 1250-850 万年前",description:"西瓦古猿出土于印巴西瓦利克山地。面部形态——凹陷的眼间、上突的门齿——与现代猩猩高度相似，被视为猩猩属的姊妹或直接干群。它证明：亚洲曾是大型人科的重要摇篮，随后随着森林收缩退向东南亚岛屿。",shortBio:"中新世南亚 · 西瓦古猿 —— 猩猩支干群，亚洲大型人科的巅峰。"},prerequisites:["node_hominid"],nextNodeId:"",extinctionNarrative:"西瓦古猿是中新世亚洲的大型猿类，面孔已透出猩猩的影子，被认为与红毛猩猩沾亲。森林退缩之下，这一支走向衰亡。"},node_dryopithecus:{id:"node_dryopithecus",type:"extinction",era:5,eraName:"中新世",geologicalPeriod:"中新世",yearsAgo:"约 1250-900 万年前",requiredTime:1440,species:{taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲",order:"灵长目",family:"人科",genus:"森林古猿属"},imagePath:"images/processed/Dryopithecus_fontani.jpg",imageWidth:0,imageHeight:0,keyInnovations:["欧洲大猿","悬吊前肢","厚牙釉质","温带森林特化"],isExtinct:!0,animationCategory:"extinct",id:"species_dryopithecus_fontani",scientificName:"Dryopithecus fontani",commonName:"代表生物：森林古猿",era:"中新世",geologicalPeriod:"中新世",eraYears:"约 1250-900 万年前",description:"森林古猿是欧洲中新世的大型人科——法国 Saint Gaudens 首次发现。它以悬吊式前肢、大型犬齿、树栖生活著称，被视作非洲大型猿类（包括人类祖先）的欧洲亲缘。晚中新世欧亚温带森林收缩时灭绝。",shortBio:"中新世欧洲 · 森林古猿 —— 非洲大猿祖先的欧洲亲缘，悬吊树栖。"},prerequisites:["node_hominid"],nextNodeId:"",extinctionNarrative:"森林古猿是中新世欧洲雨林里的树栖猿类。随着气候变冷、森林退缩，这一支走向终点，现代大猿另有其祖。"},node_sahelanthropus:{id:"node_sahelanthropus",type:"extinction",era:5,eraName:"中新世",geologicalPeriod:"中新世",yearsAgo:"约 720-680 万年前",requiredTime:1440,species:{taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲",order:"灵长目",family:"人科",genus:"沙赫人属"},imagePath:"images/processed/Sahelanthropus_tchadensis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["最古老人族候选","前置枕骨大孔","小犬齿","直立雏形"],isExtinct:!0,animationCategory:"extinct",id:"species_sahelanthropus_tchadensis",scientificName:"Sahelanthropus tchadensis",commonName:"代表生物：沙赫人",era:"中新世",geologicalPeriod:"中新世",eraYears:"约 720-680 万年前",description:'沙赫人（"Toumaï"）出土于中非乍得，是迄今最古老的可能人族成员——年代跨越人-黑猩猩分化窗口（约 700 万年前）。头骨具备：小犬齿、前突的枕骨大孔（暗示直立）、脑量约 350 cc。它是否属于人族尚有争议，但形态支持"人族与黑猩猩支系的分化发生在中新世晚期甚至更早"。',shortBio:"晚中新世 · 沙赫人 —— 最古老可能人族，横跨人-黑猩猩分化窗口。"},prerequisites:["node_hominini"],nextNodeId:"",extinctionNarrative:"沙赫人生活在约七百万年前，是目前已知最早、最接近人猿分野的候选者之一，可能已尝试直立。它是人类家谱最靠根部的一根枝，早已凋零。"},node_kenyanthropus:{id:"node_kenyanthropus",type:"extinction",era:5,eraName:"上新世",geologicalPeriod:"上新世",yearsAgo:"约 350-320 万年前",requiredTime:1440,species:{taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲",order:"灵长目",family:"人科",genus:"肯尼亚人属"},imagePath:"images/processed/Kenyanthropus_platyops.jpg",imageWidth:0,imageHeight:0,keyInnovations:["面部扁平","颧骨前置","与阿法种平行辐射","可能 rudolfensis 祖先"],isExtinct:!0,animationCategory:"extinct",id:"species_kenyanthropus_platyops",scientificName:"Kenyanthropus platyops",commonName:"代表生物：肯尼亚扁脸人",era:"上新世",geologicalPeriod:"上新世",eraYears:"约 350-320 万年前",description:"肯尼亚扁脸人由 Meave Leakey 团队于 1999 年在图尔卡纳湖西岸命名。其面部扁平、颧骨前置——与南方古猿阿法种（Lucy）的凸颌形成鲜明对比。它暗示上新世中期人族已经辐射为多形态支系，而非单一直系。有学者主张它是 Homo rudolfensis 的祖先。",shortBio:"上新世肯尼亚 · 扁脸人 —— 与 Lucy 同时代的另一支人族，面部前置。"},prerequisites:["node_hominin"],nextNodeId:"",extinctionNarrative:"肯尼亚扁脸人有一张异常扁平的脸，让古人类学家吵了很久它到底算不算独立一支。无论如何，这张扁脸没能走到今天，止步于上新世。"},node_xenarthran:{id:"node_xenarthran",type:"terminal",era:5,eraName:"古新世",geologicalPeriod:"古新世-现代",yearsAgo:"约 6500 万年前起",requiredTime:1440,species:{taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲",order:"披毛目",family:"树懒科",genus:"三趾树懒属"},imagePath:"images/processed/Bradypus_variegatus.jpg",imageWidth:0,imageHeight:0,keyInnovations:["异关节椎骨","低代谢","南美孤立演化","古老支系"],isExtinct:!1,animationCategory:"terrestrial",id:"species_bradypus_variegatus",scientificName:"Bradypus variegatus",commonName:"代表生物：褐喉三趾树懒",era:"现代",geologicalPeriod:"第四纪",eraYears:"现存",description:'异关节总目（Xenarthra）——犰狳、树懒、食蚁兽的共同类群——是南美大陆孤立演化的独立哺乳支系。分子钟显示它们早在白垩纪（约 1 亿年前）就与其他有胎盘类分离（化石记录始于古新世），独具"异关节"椎骨与低代谢。三趾树懒代谢率仅同体重哺乳类的 40%——超慢的活化石。',shortBio:"南美异关节支 · 三趾树懒 —— 慢代谢+异关节椎骨，白垩末即分离。"},prerequisites:["node_eutherian"],nextNodeId:""},node_afrothere:{id:"node_afrothere",type:"choice",era:5,eraName:"古新世-始新世",geologicalPeriod:"古新世-始新世",yearsAgo:"约 6000-5500 万年前",requiredTime:1440,species:{taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲",order:"—",family:"—",genus:"—"},imagePath:"images/processed/Tenrec_ecaudatus.jpg",imageWidth:0,imageHeight:0,keyInnovations:["多样化适应辐射","产毛细管型胎盘","睾丸腹腔内","趾甲而非爪（部分）"],isExtinct:!1,animationCategory:"terrestrial",id:"species_basal_afrotheria",scientificName:"Basal Afrotheria",commonName:"原始非洲兽总目",era:"古新世-始新世",geologicalPeriod:"古新世-始新世",eraYears:"约 6000-5500 万年前",description:"非洲兽总目（Afrotheria）是在非洲大陆隔离演化出的独特哺乳动物类群，包括象、蹄兔、海牛、土豚、马岛猬等。分子证据支持这些外形极为不同的动物共享一个非洲起源的祖先。",shortBio:"非洲兽总目——象、蹄兔、海牛、土豚的共同祖先。非洲大陆隔离演化的独特类群。"},prerequisites:["node_eutherian"],nextNodeId:"",choices:[{id:"ch_afro_elephant",targetNodeId:"node_elephant",traitChanges:[{organ:"鼻/齿",change:"普通哺乳类体型 → 巨大化+上门齿延长为象牙+鼻部延伸为长鼻",implications:["长鼻目","陆地最大动物","复杂社会认知"]}],habitatChange:"非洲草原+森林",downstreamTerminalIds:["node_elephant"],icon:"🐘",funFact:"一条鼻子里塞着约四万块肌肉——还能用人耳听不见的次声波隔空“通话”数公里"},{id:"ch_afro_manatee",targetNodeId:"node_manatee",traitChanges:[{organ:"四肢/体型",change:"陆生四足 → 前肢变桨+后肢退化为尾鳍+完全水生",im
