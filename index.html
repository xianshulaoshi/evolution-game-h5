description:"霸王龙是白垩纪末期的顶级掠食者——体长可达 12 米、咬合力世界第一（>3.5 万牛）。属于兽脚亚目，与鸟类同支——但只是鸟类的近亲，并非直系祖先。前肢退化为两指小手，成为兽脚类的极端特化。",shortBio:"白垩纪末顶级掠食者——咬合力世界第一。属兽脚亚目，是鸟类近亲但非直系祖先。",imagePath:"images/processed/Tyrannosaurus_rex.jpg",imageWidth:0,imageHeight:0,keyInnovations:["巨型体型","强大咬合力","前肢退化","兽脚亚目"],isExtinct:!0,animationCategory:"extinct"},prerequisites:["node_theropod"],nextNodeId:"",extinctionNarrative:"霸王龙有公交车那么长，咬合力冠绝陆地掠食者，是白垩纪当之无愧的暴君。可就在它称霸之时，6600 万年前的小行星从天而降——暴君也没能收到预警。"},node_synapsid:{id:"node_synapsid",type:"choice",era:4,eraName:"石炭-二叠纪",geologicalPeriod:"石炭-二叠纪",yearsAgo:"约 3.2-2.7 亿年前",requiredTime:1440,species:{id:"species_basal_synapsida",scientificName:"Basal Synapsida",commonName:"原始合弓纲",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"合弓纲",order:"—",family:"—",genus:"—"},era:"石炭-二叠纪",geologicalPeriod:"石炭-二叠纪",eraYears:"约 3.2-2.7 亿年前",description:"合弓纲共同祖先——羊膜动物两大支之一（另一支是蜥形纲）。标志性特征是单一颞孔，为下颌肌肉提供更大附着面积。石炭纪末从基干羊膜类分出，在二叠纪辐射为盘龙目（Pelycosauria，含大异齿龙）与兽孔目（Therapsida，含丽齿兽、二齿兽、犬齿兽）。二叠纪末大灭绝后，只有犬齿兽支存活并演化出哺乳动物。",shortBio:"合弓纲共同祖先。单颞孔。分岔为盘龙 → 兽孔 → 犬齿 → 哺乳类。",imagePath:"images/processed/Archaeothyris_florensis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["单颞孔","下颌肌肉强化","内温性萌芽"],isExtinct:!1,animationCategory:"terrestrial"},prerequisites:["node_amniote"],choices:[{id:"ch_syn_pelyco",targetNodeId:"node_pelycosaur",traitChanges:[{organ:"背帆/齿",change:"普通合弓 → 背部帆状神经棘 + 异型齿分化",implications:["盘龙目","温度调节展示","恐龙之前 5000 万年"]}],habitatChange:"石炭末-二叠早陆地",downstreamTerminalIds:["node_pelycosaur"],icon:"⛵",funFact:"背上竖起一面“太阳能帆”调节体温——长得像恐龙，其实是你祖先那一支"},{id:"ch_syn_caseid",targetNodeId:"node_caseid",traitChanges:[{organ:"躯干/头身比",change:"普通体型 → 巨大发酵桶体腔 + 极小头",implications:["盘龙目卡塞龙科","肠道纤维发酵","早期巨型植食"]}],habitatChange:"二叠纪陆地",downstreamTerminalIds:["node_caseid"],icon:"🛢️",funFact:"六米的身子里塞着发酵桶般的大肚子，脑袋却只有二十五厘米——头身比最魔幻"},{id:"ch_syn_therapsid",targetNodeId:"node_therapsid",traitChanges:[{organ:"颌/姿势",change:"背帆 → 消失 + 颞孔扩大 + 半直立姿势",implications:["兽孔目 Therapsida","分岔为丽齿兽/二齿兽/犬齿兽","哺乳类祖先支 最成功的物种之一——持续近 200 万年，从东非扩散到北京周口店、爪哇、格鲁吉亚德马尼西。阿舍利手斧、火的使用、身体比例已与现代人接近，脑容量 600-1100 cc。它们中的非洲群体后来演化为海德堡人，成为尼人/丹人/智人的共同祖先；亚洲的直立人则可能在孤立岛屿上分化出佛罗勒斯人、吕宋人等侏儒化后代。",shortBio:"第一个走出非洲的人属——持续近 200 万年。阿舍利工具、用火、身体比例现代化。",imagePath:"images/processed/Homo_erectus.jpg",imageWidth:0,imageHeight:0,keyInnovations:["第一个走出非洲","阿舍利工具","用火","身体比例现代化"],isExtinct:!0,animationCategory:"extinct"},prerequisites:["node_homo"],nextNodeId:"",extinctionNarrative:'直立人是第一个走出非洲、学会用火的古人类，足迹遍布亚欧，存活近两百万年——堪称人属里的"劳模"。但它最终仍被更晚的人类取代，没能等到今天。'},node_heidelbergensis:{id:"node_heidelbergensis",type:"choice",era:5,eraName:"更新世中期",geologicalPeriod:"更新世中期",yearsAgo:"约 70-30 万年前",requiredTime:1440,species:{id:"species_heidelbergensis",scientificName:"Homo heidelbergensis",commonName:"海德堡人",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲",order:"灵长目",family:"人科",genus:"人属"},era:"更新世中期",geologicalPeriod:"更新世中期",eraYears:"约 70-30 万年前",bodySize:"身高约 175 cm / 脑容量约 1100-1400 cc",description:"海德堡人是尼安德特人、丹尼索瓦人、智人三支的最后共同祖先（依主流形态-分子双证据支持）——从非洲直立人后代演化而来，脑容量首次突破现代人下限，广泛分布于非洲、欧洲、西亚。他们是最早规模化狩猎大型哺乳动物（马、犀牛、大象）的人属，德国舍宁根遗址出土了约 30 万年前的完整木制投矛。约 60 万年前非洲群体分出智人祖先支系，欧亚群体分出尼安德特-丹尼索瓦支系。",shortBio:"尼人+丹人+智人三支的最后共同祖先。脑容量突破 1100 cc，大型动物狩猎的开端。",imagePath:"images/processed/Homo_heidelbergensis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["脑容量突破 1100 cc","复合投矛","大型动物狩猎","分化出尼/丹/智三支"],isExtinct:!0,animationCategory:"extinct"},prerequisites:["node_homo"],choices:[{id:"ch_heid_sapiens",targetNodeId:"node_sapiens",traitChanges:[{organ:"颅骨与认知",change:"厚眉脊、脑量较大 → 高圆颅、下颏、前额叶皮层重构",implications:["抽象思维","符号文化","全球扩散"]}],habitatChange:"非洲→全球",downstreamTerminalIds:["node_sapiens"],icon:"🌍",funFact:"把 38 亿年生命史压成一年，你在 12 月 31 日 23:18 才登场——距午夜仅剩 42 分钟"},{id:"ch_heid_neanderthal",targetNodeId:"node_neanderthal",traitChanges:[{organ:"身体",change:"瘦高型 → 粗壮矮胖（寒冷适应）+ 大脑腔",implications:["冰河时代","大脑袋","复杂文化"]}],habitatChange:"欧洲+西亚",downstreamTerminalIds:["node_neanderthal"],icon:"🧊",funFact:"脑容量比你我还大，还会埋葬死者——粗壮的身躯是为冰河期定制的"},{id:"ch_heid_denisovan",targetNodeId:"node_denisovan",traitChanges:[{organ:"遗传",change:"海德堡人 → 亚洲内陆高海拔适应（EPAS1）",implications:["阿尔泰-西伯利亚","藏区高原基因","DNA 才发现"]}],habitatChange:"亚洲内陆",downstreamTerminalIds:["node_denisovan"],icon:"🏔️",funFact:"科学界靠一根指骨的 DNA 认出了他们——高原人群耐缺氧的基因，正来自这段混血往事"}],nextNodeId:""},node_homo_floresiensis:{id:"node_homo_floresiensis",type:"extinction",era:5,eraName:"更新世",geologicalPeriod:"更新世",yearsAgo:"约 10 万-5 万年前",requiredTime:1440,species:{id:"species_homo_floresiensis_terminal",scientificName:"Homo floresiensis",commonName:"代表生物：佛罗勒斯人",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲",order:"灵长目",family:"人科",genus:"人属"},era:"更新世",geologicalPeriod:"更新世",eraYears:"约 10 万-5 万年前",description:'佛罗勒斯人被称为"霍比特人"——身高仅约 1 米，脑容量约 400 cc。印度尼西亚佛罗勒斯岛的岛屿侏儒化案例。可能由亚洲的直立人后代在孤岛上侏儒化而来，与智人可能共存。',shortBio:'"霍比特人"——身高仅 1 米。岛屿侏儒化的极限案例。与智人可能共存。',imagePath:"images/processed/Homo_floresiensis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["岛屿侏儒化","小脑","与智人共存"],isExtinct:!0,animationCategory:"extinct"},prerequisites:["node_homo"],nextNodeId:"",extinctionNarrative:'佛罗勒斯人身高只有一米，被昵称"霍比特人"，在印尼小岛上把身材缩成了岛屿版。约五万年前他们消失，小小的身影只留在洞穴的地层里。'},node_neanderthal:{id:"node_neanderthal",type:"extinction",era:5,eraName:"更新世晚期",geologicalPeriod:"更新世晚期",yearsAgo:"约 40 万-4 万年前",requiredTime:1440,species:{id:"species_homo_neanderthalensis",scientificName:"Homo neanderthalensis",commonName:"代表生物：尼安德特人",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲",order:"灵长目",family:"人科",genus:"人属"},era:"更新世晚期",geologicalPeriod:"更新世晚期",eraYears:"约 40 万-4 万年前",bodySize:"身高 152-167 cm / 脑容量 1200-1750 cc",description:'尼安德特人是我们的"姊妹物种"——与智人共享同一祖先（海德堡人），不是我们的祖先也不是我们的后代。脑容量比现代人还大（1200-1750 cc）。复杂工具（莫斯特文化）、埋葬死者、可能创造艺术。与智人共存数千年并发生了混血——今天除非洲外所有人携带 1-2% 尼安德特人 DNA。约 4 万年前灭绝。',shortBio:"智人的姊妹物种（并非祖先！）——脑容量比我们还大。与智人混血——除非洲外所有人携带 1-2% 尼安德特人 DNA。约 4 万年前灭绝。",imagePath:"images/processed/Homo_neanderthalensis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["大脑袋","莫斯特文化","丧葬仪式","寒冷适应","与智人混血"],isExtinct:!0,animationCategory:"extinct"},prerequisites:["node_heidelbergensis"],nextNodeId:"",extinctionNarrative:'尼安德特人身强体壮、会用火、会埋葬同伴，绝非"野蛮人"的刻板印象。约四万年前他们消失，却把 1%–2% 的基因留在了今天的你我体内。'},node_denisovan:{id:"node_denisovan",type:"extinction",era:5,eraName:"更新世晚期",geologicalPeriod:"更新世晚期",yearsAgo:"约 40 万-3 万年前",requiredTime:1440,species:{id:"species_denisovan",scientificName:"Homo denisova",commonName:"代表生物：丹尼索瓦人",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲",order:"灵长目",family:"人科",genus:"人属"},era:"更新世晚期",geologicalPeriod:"更新世晚期",eraYears:"约 40 万-3 万年前",description:"丹尼索瓦人是尼安德特人的姐妹支系（都是智人的表亲）——在 2010 年才被科学确认，仅靠西伯利亚一根指骨和一颗牙齿中的 DNA 序列。他们与智人也发生过混血：EPAS1 基因帮助现代藏族人适应高海拔。",shortBio:"2010 年才被确认——仅靠一根指骨的 DNA。尼安德特人的姐妹支系，都是智人的表亲。高原适应基因传给藏族。",imagePath:"images/processed/Homo_denisova.jpg",imageWidth:0,imageHeight:0,keyInnovations:["高原适应","DNA发现","与智人混血","尼人姐妹支"],isExtinct:!0,animationCategory:"extinct"},prerequisites:["node_heidelbergensis"],nextNodeId:"",extinctionNarrative:'丹尼索瓦人是与我们并肩的古人类，靠一根指骨和一颗牙就被 DNA 认了出来。他们在更新世晚期消失，却把部分基因悄悄留在了今天某些人身上——算是另一种"活着"。'},node_sapiens:{id:"node_sapiens",type:"terminal",era:5,eraName:"更新世-全新世",geologicalPeriod:"更新世-全新世",yearsAgo:"约 30 万年前至今",requiredTime:1440,species:{id:"species_homo_sapiens",scientificName:"Homo sapiens",commonName:"代表生物：智人",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲",order:"灵长目",family:"人科",genus:"人属"},era:"更新世-全新世",geologicalPeriod:"更新世-全新世",eraYears:"约 30 万年前至今",discoveryLocation:"全球",bodySize:"身高 150-190 cm / 脑容量 1200-1500 cc",description:"智人——也就是我们。约 30 万年前出现于非洲，约 7 万年前走出非洲。创造语言、艺术、音乐、科学、技术。唯一的符号文化物种。从演化史看，我们只是非常年轻的分支——如果把 38 亿年生命史压缩成一年，智人在 12 月 31 日 23:18 才登场，离午夜只剩 42 分钟。",shortBio:"智人——也就是我们。30 万年前出现在非洲，7 万年前走出非洲。唯一创造符号文化的物种。把 38 亿年生命史压成一年，我们在除夕夜最后 42 分钟才登场。",imagePath:"images/processed/Homo_sapiens.jpg",imageWidth:0,imageHeight:0,keyInnovations:["抽象思维","复杂语言","符号文化","全球扩散","技术文明"],isExtinct:!1,animationCategory:"terrestrial"},prerequisites:["node_heidelbergensis"],nextNodeId:""},node_tunicate:{id:"node_tunicate",type:"terminal",era:3,eraName:"寒武纪",geologicalPeriod:"寒武纪",yearsAgo:"—",requiredTime:1440,species:{id:"species_ciona_intestinalis",scientificName:"Ciona intestinalis",commonName:"代表生物：玻璃海鞘",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"海鞘纲",order:"真海鞘目",family:"玻璃海鞘科",genus:"玻璃海鞘属"},era:"寒武纪",geologicalPeriod:"寒武纪",eraYears:"—",description:'海鞘代表了脊索动物中最奇特的路线——幼体像小蝌蚪，具有脊索、背神经管和肌肉尾，能自由游泳；变态后固着于岩石，成体脊索和神经系统大部分退化，身体被覆一层"被囊"（Tunicate 意为"披斗篷者"），只保留滤食功能。分子证据显示，尾索动物才是脊椎动物最近的姐妹群。 尾索动物亚门（Tunicata）包括海鞘纲、樽海鞘纲（含火体虫 Pyrosoma）和尾虫纲，均为海洋滤食者。',shortBio:'幼体像蝌蚪、成体固着的"退化脊索动物"。被囊+咽鳃篮滤食。脊椎动物最近的姐妹群。',imagePath:"images/processed/Ciona_intestinalis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["幼体脊索","被囊","咽鳃篮","变态发育"],isExtinct:!1,animationCategory:"aquatic"},prerequisites:["node_chordate"],nextNodeId:""},node_lancelet:{id:"node_lancelet",type:"terminal",era:3,eraName:"寒武纪",geologicalPeriod:"寒武纪",yearsAgo:"—",requiredTime:1440,species:{id:"species_branchiostoma_belcheri",scientificName:"Branchiostoma belcheri",commonName:"代表生物：文昌鱼",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"头索纲",order:"文昌鱼目",family:"文昌鱼科",genus:"文昌鱼属"},era:"寒武纪",geologicalPeriod:"寒武纪",eraYears:"—",description:"文昌鱼是最接近脊索动物祖先形态的活化石——终生保留纵贯全身的脊索（未被脊椎骨取代）、背神经管、咽鳃裂、分节肌肉，但缺少真正的头部分化和成对感觉器官。半埋于浅海沙底滤食。基因组解析显示它保留了脊索动物门最原始的基因组结构。",shortBio:'脊索动物门的"活化石"——终生保留脊索但未演化出脊椎骨。头索纲代表。半埋于浅海沙底滤食。',imagePath:"images/processed/Branchiostoma_belcheri.jpg",imageWidth:0,imageHeight:0,keyInnovations:["终生脊索","分节肌肉","咽鳃裂","滤食"],isExtinct:!1,animationCategory:"aquatic"},prerequisites:["node_chordate"],nextNodeId:""},node_chlorophyte:{id:"node_chlorophyte",type:"terminal",era:2,eraName:"元古宙",geologicalPeriod:"元古宙",yearsAgo:"约 10 亿年前起",requiredTime:1440,species:{imagePath:"images/processed/Volvox_carteri.jpg",imageWidth:0,imageHeight:0,isExtinct:!1,animationCategory:"microbe",id:"species_volvox_carteri",scientificName:"Volvox carteri",commonName:"代表生物：团藻",taxonomy:{domain:"真核域",kingdom:"植物界",phylum:"绿藻门",className:"绿藻纲",order:"团藻目",family:"团藻科",genus:"团藻属"},era:"元古宙至今",geologicalPeriod:"元古宙",eraYears:"约 10 亿年前起",description:'绿藻纲的团藻是研究"多细胞起源"最经典的活模型——数千个衣藻式细胞排列成中空球体，具有明显的体细胞/生殖细胞分化，通过鞭毛协调运动。它代表了绿藻植物（绿藻支系）在淡水浮游生态位的成功辐射，与链形植物支（含陆地植物）为并列的两大绿藻大支。',shortBio:"衣藻式细胞组成的中空球体——多细胞起源的经典模型。淡水浮游辐射路线。",keyInnovations:["体细胞/生殖细胞分化","鞭毛协调","群体协作"]},prerequisites:["node_plantae_ancestor"],nextNodeId:""},node_zygnematophyte:{id:"node_zygnematophyte",type:"terminal",era:2,eraName:"元古宙",geologicalPeriod:"元古宙",yearsAgo:"约 8 亿年前起",requiredTime:1440,species:{imagePath:"images/processed/Spirogyra.jpg",imageWidth:0,imageHeight:0,isExtinct:!1,animationCategory:"microbe",id:"species_spirogyra",scientificName:"Spirogyra sp.",commonName:"代表生物：水绵",taxonomy:{domain:"真核域",kingdom:"植物界",phylum:"链形植物门",className:"双星藻纲",order:"双星藻目",family:"双星藻科",genus:"水绵属"},era:"元古宙至今",geologicalPeriod:"元古宙",eraYears:"约 8 亿年前起",description:'水绵所在的双星藻纲是分子系统学揭示的"陆地植物最近的姐妹群"（Wickett et al. 2014）。它完全丧失了鞭毛，进化出独特的接合生殖：两条丝状体接触后形成接合管，配子通过管道汇合。螺旋带状叶绿体是它的标志。',shortBio:"池塘绿丝——陆地植物最近的姐妹群。丧失鞭毛，采用接合生殖，螺旋带状叶绿体。",keyInnovations:["接合生殖","丧失鞭毛","螺旋叶绿体"]},prerequisites:["node_plantae_ancestor"],nextNodeId:""},node_coelacanth:{id:"node_coelacanth",type:"terminal",era:3,eraName:"泥盆纪至今",geologicalPeriod:"泥盆纪",yearsAgo:"约 4 亿年前起",requiredTime:1440,species:{imagePath:"images/processed/Latimeria_chalumnae.jpg",imageWidth:0,imageHeight:0,isExtinct:!1,animationCategory:"aquatic",id:"species_latimeria_chalumnae",scientificName:"Latimeria chalumnae",commonName:"代表生物：西印度洋腔棘鱼",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"肉鳍鱼纲",order:"腔棘鱼目",family:"矛尾鱼科",genus:"矛尾鱼属"},era:"泥盆纪至今",geologicalPeriod:"泥盆纪",eraYears:"约 4 亿年前起",description:'腔棘鱼曾被认为在白垩纪末灭绝，直到 1938 年在南非海域被重新发现——这是 20 世纪最震撼的动物学发现之一。它保留了 4 亿年前的形态：分节的肉质鳍、脑仅占颅腔 1.5%、卵胎生。作为四足动物近亲中的深海保守派，它是"活化石"的代名词。',shortBio:'4 亿年"活化石"——1938 年被重新发现。深海保守派肉鳍鱼，卵胎生。',keyInnovations:["分节肉鳍","卵胎生","颅内关节"]},prerequisites:["node_lobefin"],nextNodeId:""},node_lungfish:{id:"node_lungfish",type:"terminal",era:3,eraName:"泥盆纪至今",geologicalPeriod:"泥盆纪",yearsAgo:"约 4 亿年前起",requiredTime:1440,species:{imagePath:"images/processed/Neoceratodus_forsteri.jpg",imageWidth:0,imageHeight:0,isExtinct:!1,animationCategory:"aquatic",id:"species_neoceratodus_forsteri",scientificName:"Neoceratodus forsteri",commonName:"代表生物：澳洲肺鱼",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"肉鳍鱼纲",order:"角齿鱼目",family:"角齿鱼科",genus:"角齿鱼属"},era:"泥盆纪至今",geologicalPeriod:"泥盆纪",eraYears:"约 4 亿年前起",description:"肺鱼的鳔演化成了真正的肺，可以直接呼吸空气，是四足动物最近的现存鱼类姐妹群（分子和基因组证据均支持）。非洲肺鱼在旱季会分泌黏液茧、埋入泥中夏眠数月，靠肺呼吸维生。澳洲肺鱼保留了最原始的单肺结构。",shortBio:"四足动物最近的现存鱼类姐妹群——鳔演化为肺，可空气呼吸。旱季黏液茧夏眠。",keyInnovations:["真正的肺","内鼻孔","夏眠机制"]},prerequisites:["node_lobefin"],nextNodeId:""},node_cynognathus:{id:"node_cynognathus",type:"extinction",era:4,eraName:"三叠纪",geologicalPeriod:"三叠纪早-中期",yearsAgo:"约 2.4 亿年前",requiredTime:1440,species:{imagePath:"images/processed/Cynognathus_crateronotus.jpg",imageWidth:0,imageHeight:0,isExtinct:!0,animationCategory:"terrestrial",id:"species_cynognathus_crateronotus",scientificName:"Cynognathus crateronotus",commonName:"代表生物：犬颌兽",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"合弓纲",order:"兽孔目",family:"犬颌兽科",genus:"犬颌兽属"},era:"三叠纪",geologicalPeriod:"三叠纪",eraYears:"约 2.4 亿年前",description:"犬颌兽是三叠纪最成功的肉食性兽孔类之一，体长可达 1.2 米，头骨占身体比重巨大，咬合力强劲，具有典型的犬齿兽异型齿。它遍布南极、南非、南美、印度等冈瓦纳大陆——是大陆漂移学说的重要地层证据。它没有演化为哺乳形类，在中三叠世被新兴主龙类竞争取代而灭绝。",shortBio:"三叠纪顶级肉食性兽孔类——冈瓦纳大陆漂移的地层证据。未演化为哺乳形类。",keyInnovations:["大型化","异型齿捕食","直立步态"]},prerequisites:["node_cynodont"],nextNodeId:"",extinctionNarrative:"犬颌兽是三叠纪的似哺乳爬行动物，已经长出了近似哺乳类的颌与牙。它是通往哺乳动物道路上的探路者，自身这一支却没能延续，把接力棒交了出去。"},node_tritylodont:{id:"node_tritylodont",type:"extinction",era:4,eraName:"侏罗纪",geologicalPeriod:"三叠纪末-白垩纪早期",yearsAgo:"约 2 亿-1 亿年前",requiredTime:1440,species:{imagePath:"images/processed/Kayentatherium_wellesi.jpg",imageWidth:0,imageHeight:0,isExtinct:!0,animationCategory:"terrestrial",id:"species_kayentatherium_wellesi",scientificName:"Kayentatherium wellesi",commonName:"代表生物：卡岩塔兽",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"合弓纲",order:"兽孔目",family:"三列齿兽科",genus:"卡岩塔兽属"},era:"侏罗纪",geologicalPeriod:"侏罗纪早期",eraYears:"约 1.85 亿年前",description:'三列齿兽科是植食化到极致的犬齿兽——门齿演化为啮齿状、颊齿呈多列磨面，能高效磨碎植物纤维。它们与最早的哺乳形类共存了 1 亿年，最终在白垩纪早期灭绝。2018 年发现的卡岩塔兽标本保留了 38 只幼崽的化石，证明其"多产"繁殖策略——与真正哺乳动物的少子精育截然不同。',shortBio:"啮齿状门齿+多列磨牙的植食性犬齿兽。与哺乳形类共存 1 亿年。一次产 38 崽的多产策略。",keyInnovations:["植食化","啮齿状门齿","多列磨牙","穴居"]},prerequisites:["node_cynodont"],nextNodeId:"",extinctionNarrative:"卡岩塔兽是最像哺乳动物的爬行动物之一，长着一口高效的磨牙。它与真正的哺乳类并肩生活了一阵，最终没能跑赢这场演化竞赛。"},node_ichthyosporea:{id:"node_ichthyosporea",type:"terminal",era:2,eraName:"元古宙",geologicalPeriod:"元古宙",yearsAgo:"约 10 亿年前起",requiredTime:1440,species:{imagePath:"images/processed/Sphaeroforma_arctica.jpg",imageWidth:0,imageHeight:0,isExtinct:!1,animationCategory:"microbe",id:"species_sphaeroforma_arctica",scientificName:"Sphaeroforma arctica",commonName:"代表生物：北极球形虫",taxonomy:{domain:"真核域",kingdom:"原生生物界",phylum:"后鞭毛门",className:"蜷丝虫纲",order:"球形虫目",family:"球形虫科",genus:"球形虫属"},era:"元古宙至今",geologicalPeriod:"元古宙",eraYears:"约 10 亿年前起",description:'蜷丝虫纲是与动物-真菌并列的后鞭毛生物第三大支系，主要寄生于鱼类和两栖类。北极球形虫因其生活史与动物早期胚胎发育惊人相似而成为"动物多细胞起源"研究的关键模型：单细胞长成多核合胞体，随后同步细胞化，形成短暂的多细胞球——展示了动物多细胞化的一种可能过渡路线。',shortBio:"与动物-真菌并列的后鞭毛第三支——寄生鱼类/两栖。多核合胞体→细胞化，展示动物多细胞起源。",keyInnovations:["多核合胞体","同步细胞化","寄生生态位"]},prerequisites:["node_opisthokont"],nextNodeId:""},node_choanoflagellate:{id:"node_choanoflagellate",type:"terminal",era:2,eraName:"元古宙",geologicalPeriod:"元古宙",yearsAgo:"约 9 亿年前至今",requiredTime:1440,species:{imagePath:"images/processed/Salpingoeca_rosetta.jpg",imageWidth:0,imageHeight:0,isExtinct:!1,animationCategory:"microbe",id:"species_choanoflagellate",scientificName:"Salpingoeca rosetta",commonName:"代表生物：领鞭毛虫",taxonomy:{domain:"真核域",kingdom:"原生生物界",phylum:"领鞭毛虫门",className:"领鞭毛虫纲",order:"领鞭毛虫目",family:"领鞭毛虫科",genus:"领鞭毛虫属"},era:"元古宙至今",geologicalPeriod:"元古宙",eraYears:"约 9 亿年前至今",description:'领鞭毛虫是现存与动物最接近的单细胞生物，属 Choanoflagellatea，是动物界的姐妹群（而非祖先）。单个细胞的领细胞结构——鞭毛外围一圈微绒毛过滤水中细菌——与海绵的领细胞几乎相同。部分种在特定信号下能形成"玫瑰花状"多细胞群体，成为研究动物多细胞化机制的关键模型。',shortBio:"动物的现存姐妹群单细胞——领细胞与海绵同源，群体形成机制是多细胞化研究模型。",keyInnovations:["领细胞结构","群体形成潜能","微绒毛环滤食"]},prerequisites:["node_opisthokont"],nextNodeId:""},node_stem_tetrapod:{id:"node_stem_tetrapod",type:"extinction",era:3,eraName:"泥盆纪",geologicalPeriod:"泥盆纪晚期",yearsAgo:"约 3.65 亿年前",requiredTime:1440,species:{imagePath:"images/processed/Ichthyostega.jpg",imageWidth:0,imageHeight:0,isExtinct:!0,animationCategory:"aquatic",id:"species_ichthyostega",scientificName:"Ichthyostega stensioei",commonName:"代表生物：鱼石螈",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"四足形纲",order:"鱼石螈目",family:"鱼石螈科",genus:"鱼石螈属"},era:"泥盆纪",geologicalPeriod:"泥盆纪晚期",eraYears:"约 3.65 亿年前",description:'鱼石螈是四足动物登陆的"失败模型"——它同时保留鱼类的尾鳍、鳃盖骨、侧线，又发展出承重的四肢和肋骨。但它的后肢有 7 根脚趾（并非现代四足动物的 5 根），肩带结构表明它主要靠前肢支撑爬行，后肢像海豹一样只能拖动身体。它更多时候仍生活在水中，是一次"未完成的登陆"，随泥盆纪末灭绝走向终局。',shortBio:'"未完成的登陆"——七指前肢，仍主要生活在水中。四足动物早期实验的失败分支。',keyInnovations:["多指肢（7指）","肋骨承重","保留鳃盖骨"]},prerequisites:["node_tetrapod_choice"],nextNodeId:"",extinctionNarrative:"鱼石螈是最早尝试登陆的四足动物之一，能撑起身体却走得笨拙，仍离不开水。它是登陆史上的先驱，自身这一支却没能延续到最后。"},node_mesosaurus:{id:"node_mesosaurus",type:"extinction",era:3,eraName:"二叠纪",geologicalPeriod:"二叠纪早期",yearsAgo:"约 2.9 亿年前",requiredTime:1440,species:{imagePath:"images/processed/Mesosaurus_tenuidens.jpg",imageWidth:0,imageHeight:0,isExtinct:!0,animationCategory:"aquatic",id:"species_mesosaurus_tenuidens",scientificName:"Mesosaurus tenuidens",commonName:"代表生物：中龙",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"副爬行纲",order:"中龙目",family:"中龙科",genus:"中龙属"},era:"二叠纪",geologicalPeriod:"二叠纪早期",eraYears:"约 2.9 亿年前",description:"中龙是最早重返水中的羊膜动物——刚登陆不久，就有一支后代重新演化出适合游泳的长尾、桨状四肢和滤食性长齿。它同时出现在南非和南美的同一地层，是大陆漂移学说的经典地层证据（南美-非洲曾相连）。副爬行纲的其他成员在二叠纪末大灭绝中几乎全部消亡。**注：**中龙的分类归属长期存在争议——传统观点归副爬行纲，近年一些分析将其归到真爬行动物基部或双孔类干群。",shortBio:"最早重返水中的羊膜类——南非与南美的地层化石共同证明了大陆漂移。二叠纪中期灭绝。",keyInnovations:["滤食长齿","桨状四肢","重返水中"]},prerequisites:["node_amniote"],nextNodeId:"",extinctionNarrative:"中龙是最早重返水中的爬行动物之一，满口细长的牙齿用来滤食小虾。它是二叠纪早期的一次水生实验，很快就走到了尽头。"},node_spirochaete:{id:"node_spirochaete",type:"terminal",era:1,eraName:"太古宙至今",geologicalPeriod:"太古宙",yearsAgo:"约 30 亿年前起",requiredTime:0,species:{id:"species_borrelia_burgdorferi",scientificName:"Borrelia burgdorferi",commonName:"代表生物：伯氏疏螺旋体",taxonomy:{domain:"细菌域",kingdom:"细菌界",phylum:"螺旋体门",className:"螺旋体纲",order:"螺旋体目",family:"疏螺旋体科",genus:"疏螺旋体属"},era:"太古宙至今",geologicalPeriod:"太古宙",eraYears:"约 30 亿年前起",bodySize:"",description:'螺旋体门的独特之处是"内鞭毛"——鞭毛位于外膜与内膜之间的周质空间中，驱动整个菌体像开瓶器一样螺旋前进，能穿透黏液和组织。伯氏疏螺旋体由蜱传播，是莱姆病的病原。梅毒螺旋体也属于此门。',shortBio:"内鞭毛开瓶器运动——莱姆病病原。螺旋体门的代表。",imagePath:"images/processed/Borrelia_burgdorferi.jpg",imageWidth:0,imageHeight:0,keyInnovations:["内鞭毛（周质鞭毛）","螺旋细胞形态","穿透组织能力"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_bacteria_ancestor"],nextNodeId:""},node_bacteroides:{id:"node_bacteroides",type:"terminal",era:1,eraName:"太古宙至今",geologicalPeriod:"太古宙",yearsAgo:"约 25 亿年前起",requiredTime:0,species:{id:"species_bacteroides_fragilis",scientificName:"Bacteroides fragilis",commonName:"代表生物：脆弱拟杆菌",taxonomy:{domain:"细菌域",kingdom:"细菌界",phylum:"拟杆菌门",className:"拟杆菌纲",order:"拟杆菌目",family:"拟杆菌科",genus:"拟杆菌属"},era:"太古宙至今",geologicalPeriod:"太古宙",eraYears:"约 25 亿年前起",bodySize:"",description:'拟杆菌是人体肠道菌群的主要成员之一，占肠道细菌 25%-50%。它们携带庞大的多糖裂解酶基因组，能降解人体自身无法消化的膳食纤维和黏蛋白，产出短链脂肪酸供宿主吸收——是"人-微生物共代谢"的关键节点。',shortBio:"肠道多糖降解主力——占人肠道菌 25-50%，产出短链脂肪酸。",imagePath:"images/processed/Bacteroides_fragilis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["多糖利用位点(PUL)","厌氧代谢","肠道共生"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_bacteria_ancestor"],nextNodeId:""},node_green_sulfur:{id:"node_green_sulfur",type:"terminal",era:1,eraName:"太古宙至今",geologicalPeriod:"太古宙",yearsAgo:"约 33 亿年前起",requiredTime:0,species:{id:"species_chlorobium",scientificName:"Chlorobium tepidum",commonName:"代表生物：嗜热绿硫菌",taxonomy:{domain:"细菌域",kingdom:"细菌界",phylum:"绿硫细菌门",className:"绿硫细菌纲",order:"绿硫细菌目",family:"绿硫细菌科",genus:"绿硫菌属"},era:"太古宙至今",geologicalPeriod:"太古宙",eraYears:"约 33 亿年前起",bodySize:"",description:'绿硫细菌是最古老的光合生物之一——它进行的"不产氧光合作用"以硫化氢（H₂S）为电子供体，副产物是硫单质而不是氧气。它们生活在光穿透微弱的厌氧水层（黑海、湖泊变温层），利用绿色体（chlorosome）这种巨型光收集器捕获稀疏光子。',shortBio:"不产氧光合先驱——H₂S 作电子供体产硫。绿色体巨型光收集器。",imagePath:"images/processed/Chlorobium_tepidum.jpg",imageWidth:0,imageHeight:0,keyInnovations:["不产氧光合作用","绿色体","H₂S 硫氧化"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_bacteria_ancestor"],nextNodeId:""},node_phormidium:{id:"node_phormidium",type:"terminal",era:1,eraName:"太古宙至今",geologicalPeriod:"太古宙",yearsAgo:"约 30 亿年前起",requiredTime:0,species:{id:"species_phormidium",scientificName:"Phormidium sp.",commonName:"代表生物：席藻",taxonomy:{domain:"细菌域",kingdom:"细菌界",phylum:"蓝细菌门",className:"蓝细菌纲",order:"颤藻目",family:"颤藻科",genus:"席藻属"},era:"太古宙至今",geologicalPeriod:"太古宙",eraYears:"约 30 亿年前起",bodySize:"",description:'席藻是构建"层叠石"（stromatolite）的主力——这是地球上最古老的宏观化石（30 亿年前）。它以简单丝状体形式聚集成菌毯，捕获矿物颗粒并粘结成分层结构。前寒武纪的浅海几乎全被这类蓝细菌菌毯覆盖，将大气从缺氧改造成富氧，是"大氧化事件"的推手。',shortBio:"层叠石建造者——30 亿年前形成地球最古老宏观化石，推动大氧化事件。",imagePath:"images/processed/Phormidium_sp..jpg",imageWidth:0,imageHeight:0,keyInnovations:["丝状菌毯","矿物粘结","生物成因层叠石"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_cyanobacteria"],nextNodeId:""},node_spirulina:{id:"node_spirulina",type:"terminal",era:1,eraName:"太古宙至今",geologicalPeriod:"太古宙",yearsAgo:"约 25 亿年前起",requiredTime:0,species:{id:"species_arthrospira_platensis",scientificName:"Arthrospira platensis",commonName:"代表生物：钝顶螺旋藻",taxonomy:{domain:"细菌域",kingdom:"细菌界",phylum:"蓝细菌门",className:"蓝细菌纲",order:"颤藻目",family:"席藻科",genus:"节旋藻属"},era:"太古宙至今",geologicalPeriod:"太古宙",eraYears:"约 25 亿年前起",bodySize:"",description:"螺旋藻是极少数能在强碱性湖水（pH 9-11）中大规模繁盛的蓝细菌，产生特征性的开放式螺旋细胞链。它蛋白质含量高达干重 60-70%，非洲乍得湖畔的卡内布族群把它做成 dihé 饼食用了几个世纪，如今是全球性的食品/饲料添加剂。",shortBio:"强碱湖(pH 9-11)螺旋链——蛋白含量 60-70%，非洲食用几百年。",imagePath:"images/processed/Arthrospira_platensis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["开放螺旋形态","强碱耐受","高蛋白生物质"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_cyanobacteria"],nextNodeId:""},node_rickettsia:{id:"node_rickettsia",type:"terminal",era:1,eraName:"太古宙至今",geologicalPeriod:"太古宙",yearsAgo:"约 15 亿年前起",requiredTime:0,species:{id:"species_rickettsia_prowazekii",scientificName:"Rickettsia prowazekii",commonName:"代表生物：普氏立克次体",taxonomy:{domain:"细菌域",kingdom:"细菌界",phylum:"变形菌门",className:"α-变形菌纲",order:"立克次体目",family:"立克次体科",genus:"立克次体属"},era:"太古宙至今",geologicalPeriod:"太古宙",eraYears:"约 15 亿年前起",bodySize:"",description:"立克次体是彻底的胞内寄生菌——基因组严重萎缩(1.1 Mb)，丢失了几乎所有独立生存所需的代谢通路，必须依赖宿主细胞的 ATP、氨基酸和核苷酸。分子系统学曾提出它与线粒体祖先最近缘——线粒体源自 α-变形菌的一支，但其具体姐妹群至今仍有争议。它由虱子传播，是斑疹伤寒的病原。",shortBio:"胞内寄生极简菌——与线粒体祖先同源。斑疹伤寒病原，虱传。",imagePath:"images/processed/Rickettsia_prowazekii.jpg",imageWidth:0,imageHeight:0,keyInnovations:["胞内寄生","基因组萎缩","ATP 掠夺"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_proteobacteria"],nextNodeId:""},node_pseudomonas:{id:"node_pseudomonas",type:"terminal",era:1,eraName:"太古宙至今",geologicalPeriod:"太古宙",yearsAgo:"约 20 亿年前起",requiredTime:0,species:{id:"species_pseudomonas_aeruginosa",scientificName:"Pseudomonas aeruginosa",commonName:"代表生物：铜绿假单胞菌",taxonomy:{domain:"细菌域",kingdom:"细菌界",phylum:"变形菌门",className:"γ-变形菌纲",order:"假单胞菌目",family:"假单胞菌科",genus:"假单胞菌属"},era:"太古宙至今",geologicalPeriod:"太古宙",eraYears:"约 20 亿年前起",bodySize:"",description:'铜绿假单胞菌是"环境万金油"——它的 6.3 Mb 基因组编码了极为多样的代谢通路，可以在土壤、淡水、海水乃至医用设备表面繁殖，还是院内感染和囊性纤维化肺病的头号机会性病原。它分泌绿脓素给菌落染上标志性蓝绿色，并通过群体感应协调生物膜的形成。',shortBio:"环境万金油+院内感染王——绿脓素染蓝绿，群体感应生物膜。",imagePath:"images/processed/Pseudomonas_aeruginosa.jpg",imageWidth:0,imageHeight:0,keyInnovations:["代谢通用性","生物膜/群体感应","多重耐药性"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_proteobacteria"],nextNodeId:""},node_beggiatoa:{id:"node_beggiatoa",type:"terminal",era:1,eraName:"太古宙至今",geologicalPeriod:"太古宙",yearsAgo:"约 25 亿年前起",requiredTime:0,species:{id:"species_beggiatoa",scientificName:"Beggiatoa alba",commonName:"代表生物：贝日阿托氏菌",taxonomy:{domain:"细菌域",kingdom:"细菌界",phylum:"变形菌门",className:"γ-变形菌纲",order:"硫发菌目",family:"贝日阿托氏菌科",genus:"贝日阿托氏菌属"},era:"太古宙至今",geologicalPeriod:"太古宙",eraYears:"约 25 亿年前起",bodySize:"",description:'贝日阿托氏菌是"细菌中的巨人"——单个细胞直径可达 200 μm，肉眼可见的白色丝状体。它是化能自养菌，通过氧化 H₂S 为硫单质并进一步氧化为硫酸盐来获取能量，把硫粒储存在细胞内。它在深海热液喷口和缺氧海底沉积物上形成"细菌垫"，是硫循环的关键推手。',shortBio:"肉眼可见巨型细菌——氧化 H₂S 储硫，深海热液喷口生态基石。",imagePath:"images/processed/Beggiatoa_alba.jpg",imageWidth:0,imageHeight:0,keyInnovations:["化能自养硫氧化","巨型细胞(200μm)","硫粒储存"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_proteobacteria"],nextNodeId:""},node_staph:{id:"node_staph",type:"terminal",era:1,eraName:"太古宙至今",geologicalPeriod:"太古宙",yearsAgo:"约 25 亿年前起",requiredTime:0,species:{id:"species_staphylococcus_aureus",scientificName:"Staphylococcus aureus",commonName:"代表生物：金黄色葡萄球菌",taxonomy:{domain:"细菌域",kingdom:"细菌界",phylum:"厚壁菌门",className:"芽孢杆菌纲",order:"芽孢杆菌目",family:"葡萄球菌科",genus:"葡萄球菌属"},era:"太古宙至今",geologicalPeriod:"太古宙",eraYears:"约 25 亿年前起",bodySize:"",description:"金黄色葡萄球菌以葡萄串状球菌集落而得名，是皮肤和鼻腔的常在菌，也是最重要的化脓性感染病原之一。它分泌多种毒素（α-溶血素、TSST-1）和免疫逃避因子（凝固酶、蛋白 A），并极易演化耐药——耐甲氧西林金葡菌(MRSA)是全球院感的头号威胁。",shortBio:"葡萄串状球菌——皮肤/鼻腔常在菌，MRSA 耐药引发院感。",imagePath:"images/processed/Staphylococcus_aureus.jpg",imageWidth:0,imageHeight:0,keyInnovations:["葡萄串状集落","凝固酶/α-溶血素","快速耐药演化"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_gram_positive"],nextNodeId:""},node_mycoplasma:{id:"node_mycoplasma",type:"terminal",era:1,eraName:"太古宙至今",geologicalPeriod:"太古宙",yearsAgo:"约 15 亿年前起",requiredTime:0,species:{id:"species_mycoplasma_pneumoniae",scientificName:"Mycoplasma pneumoniae",commonName:"代表生物：肺炎支原体",taxonomy:{domain:"细菌域",kingdom:"细菌界",phylum:"厚壁菌门",className:"柔膜菌纲",order:"支原体目",family:"支原体科",genus:"支原体属"},era:"太古宙至今",geologicalPeriod:"太古宙",eraYears:"约 15 亿年前起",bodySize:"",description:'支原体是"没有细胞壁的细菌"——柔膜菌纲丢弃了肽聚糖细胞壁，只靠一层膜维持形状，导致它天然对青霉素等作用于细胞壁的抗生素免疫。它是能独立生存的最小生物之一（基因组仅 0.8 Mb），也是"合成生物学最小基因组"研究的重要起点。',shortBio:"没有细胞壁的最小细菌——对青霉素天然耐药，合成生物学起点。",imagePath:"images/processed/Mycoplasma_pneumoniae.jpg",imageWidth:0,imageHeight:0,keyInnovations:["丢失细胞壁","极简基因组(0.8Mb)","天然β-内酰胺耐药"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_gram_positive"],nextNodeId:""},node_clostridium:{id:"node_clostridium",type:"terminal",era:1,eraName:"太古宙至今",geologicalPeriod:"太古宙",yearsAgo:"约 25 亿年前起",requiredTime:0,species:{id:"species_clostridium_tetani",scientificName:"Clostridium tetani",commonName:"代表生物：破伤风梭菌",taxonomy:{domain:"细菌域",kingdom:"细菌界",phylum:"厚壁菌门",className:"梭菌纲",order:"梭菌目",family:"梭菌科",genus:"梭菌属"},era:"太古宙至今",geologicalPeriod:"太古宙",eraYears:"约 25 亿年前起",bodySize:"",description:"梭菌属是严格厌氧的芽孢产生者——它们的芽孢可以在土壤中休眠数十年，一旦进入创口的缺氧环境立刻萌发。破伤风梭菌分泌破伤风痉挛毒素(TeNT)，是已知毒性最强的生物毒素之一，微克量级即致命，通过阻断脊髓抑制性神经元引发全身骨骼肌强直。同属的肉毒杆菌(C. botulinum)和艰难梭菌(C. difficile)也在人类历史上举足轻重。",shortBio:"土壤中的死神——严格厌氧芽孢+微克致命神经毒素。",imagePath:"images/processed/Clostridium_tetani.jpg",imageWidth:0,imageHeight:0,keyInnovations:["耐热芽孢","严格厌氧","神经毒素分泌"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_gram_positive"],nextNodeId:""},node_thaumarchaeota:{id:"node_thaumarchaeota",type:"terminal",era:1,eraName:"太古宙至今",geologicalPeriod:"太古宙",yearsAgo:"约 25 亿年前起",requiredTime:0,species:{id:"species_nitrosopumilus_maritimus",scientificName:"Nitrosopumilus maritimus",commonName:"代表生物：海洋氨氧化古菌",taxonomy:{domain:"古菌域",kingdom:"古菌界",phylum:"奇古菌门",className:"硝化古菌纲",order:"硝化古菌目",family:"硝化古菌科",genus:"硝化亚硝古菌属"},era:"太古宙至今",geologicalPeriod:"太古宙",eraYears:"约 25 亿年前起",bodySize:"",description:'2004 年之前，教科书说"氨氧化是细菌的专利"。基因组学的兴起彻底改写了这一认知——奇古菌门被发现是海洋中数量最丰富的微生物之一（占深海微生物总量 20-40%），是全球氮循环第一步"氨→亚硝酸"的主力担当。它的固碳效率极高，靠亚硝酸中间体驱动 CO₂ 固定，是深海生态系统的隐藏基石。',shortBio:"海洋氨氧化主力——占深海微生物 20-40%，改写全球氮循环认知。",imagePath:"images/processed/Nitrosopumilus_maritimus.jpg",imageWidth:0,imageHeight:0,keyInnovations:["氨单加氧酶","海洋辐射","低氨浓度亲和力"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_archaea_ancestor"],nextNodeId:""},node_asgard:{id:"node_asgard",type:"terminal",era:1,eraName:"太古宙至今",geologicalPeriod:"太古宙",yearsAgo:"约 20 亿年前起",requiredTime:0,species:{id:"species_lokiarchaeota",scientificName:"Candidatus Prometheoarchaeum syntrophicum",commonName:"代表生物：普罗米修斯古菌",taxonomy:{domain:"古菌域",kingdom:"古菌界",phylum:"阿斯加德古菌门",className:"洛基古菌纲",order:"洛基古菌目",family:"",genus:""},era:"太古宙至今",geologicalPeriod:"太古宙",eraYears:"约 20 亿年前起",bodySize:"",description:'2015 年在挪威洛基城堡热液喷口宏基因组中发现的洛基古菌，让真核起源研究进入了新纪元——它基因组中携带大量真核标志基因(actin/tubulin/ubiquitin 类似物)，是真核细胞已知最近的姐妹群。2020 年日本团队(Imachi et al., Nature)成功培养出了阿斯加德古菌 MK-D1，观察到它伸出长长的细胞突起去"抱住"共生细菌，形成了共生细胞前体形态。',shortBio:"真核细胞的姐妹群——2015 年洛基城堡发现，2020 年首次培养。突起抱伙伴。",imagePath:"images/processed/Candidatus_Prometheoarchaeum_syntrophicum.jpg",imageWidth:0,imageHeight:0,keyInnovations:["真核标志基因","细胞突起","共生细胞前体"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_archaea_ancestor"],nextNodeId:""},node_nanoarchaea:{id:"node_nanoarchaea",type:"terminal",era:1,eraName:"太古宙至今",geologicalPeriod:"太古宙",yearsAgo:"约 20 亿年前起",requiredTime:0,species:{id:"species_nanoarchaeum_equitans",scientificName:"Nanoarchaeum equitans",commonName:"代表生物：骑行纳古菌",taxonomy:{domain:"古菌域",kingdom:"古菌界",phylum:"纳古菌门",className:"纳古菌纲",order:"纳古菌目",family:"纳古菌科",genus:"纳古菌属"},era:"太古宙至今",geologicalPeriod:"太古宙",eraYears:"约 20 亿年前起",bodySize:"",description:'纳古菌是"细胞里的细胞"——它直径仅 400 nm(比典型古菌小十倍)，基因组只有 0.49 Mb，缺失几乎所有生物合成通路，必须附着于另一种古菌 Ignicoccus hospitalis 的表面才能存活。2002 年在冰岛热液喷口首次发现，是极端小型化寄生古菌的代表，也是研究"生命的最低基因组门槛"的重要模型。',shortBio:"细胞骑手——直径 400nm 附着大古菌表面共生，基因组 0.49Mb。",imagePath:"images/processed/Nanoarchaeum_equitans.jpg",imageWidth:0,imageHeight:0,keyInnovations:["极端小型化","细胞表面寄生","基因组极简"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_archaea_ancestor"],nextNodeId:""},node_excavata_ancestor:{id:"node_excavata_ancestor",type:"terminal",era:1,eraName:"元古宙至今",geologicalPeriod:"元古宙",yearsAgo:"约 18 亿年前起",requiredTime:0,species:{id:"species_giardia_lamblia",scientificName:"Giardia lamblia",commonName:"代表生物：蓝氏贾第鞭毛虫",taxonomy:{domain:"真核域",kingdom:"原生生物界",phylum:"后滴门（Metamonada）",className:"双滴虫纲",order:"双滴虫目",family:"六鞭毛科",genus:"贾第虫属"},era:"元古宙至今",geologicalPeriod:"元古宙",eraYears:"约 18 亿年前起",bodySize:"",description:'Excavata 超群以细胞腹面的"进食沟槽"为共同特征。贾第虫是这个超群的经典代表——它有两个细胞核和四对鞭毛的对称结构，"看起来在盯着你"。它彻底放弃了正常的线粒体，只保留了极度退化的"线粒体残体(mitosome)"，是研究真核细胞早期演化的活化石之一。它是水源性腹泻的常见病原。',shortBio:'两核四对鞭毛"盯着你"的原虫——线粒体退化为残体，早期真核活化石。',imagePath:"images/processed/Giardia_lamblia.jpg",imageWidth:0,imageHeight:0,keyInnovations:["腹面进食沟槽","线粒体残体(mitosome)","双核对称"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_eukaryote_ancestor"],nextNodeId:""},node_rhizaria_ancestor:{id:"node_rhizaria_ancestor",type:"terminal",era:1,eraName:"元古宙至今",geologicalPeriod:"元古宙",yearsAgo:"约 15 亿年前起",requiredTime:0,species:{id:"species_globigerina",scientificName:"Globigerina bulloides",commonName:"代表生物：球房虫（有孔虫）",taxonomy:{domain:"真核域",kingdom:"原生生物界",phylum:"有孔虫门",className:"球房虫纲",order:"球房虫目",family:"球房虫科",genus:"球房虫属"},era:"元古宙至今",geologicalPeriod:"元古宙",eraYears:"约 15 亿年前起",bodySize:"",description:'Rhizaria 超群以"丝状/网状伪足"为共同特征。有孔虫分泌方解石外壳、伸出细如发丝的伪足网抓捕食物，死后外壳沉积成"全球性有孔虫软泥"——占深海沉积物的很大一部分。它们的化石在地层学上是精确的时代指示物，白垩纪由此得名——白垩层主要由另一类钙化浮游生物颗石藻的板片构成，有孔虫壳也是其中的重要成分。',shortBio:"方解石外壳+网状伪足——与颗石藻共同堆成白垩层，白垩纪之名的由来。",imagePath:"images/processed/Globigerina_bulloides.jpg",imageWidth:0,imageHeight:0,keyInnovations:["丝状/网状伪足","方解石外壳","深海软泥"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_eukaryote_ancestor"],nextNodeId:""},node_euglena:{id:"node_euglena",type:"terminal",era:1,eraName:"元古宙至今",geologicalPeriod:"元古宙",yearsAgo:"约 15 亿年前起",requiredTime:0,species:{id:"species_euglena_gracilis",scientificName:"Euglena gracilis",commonName:"代表生物：纤细裸藻（眼虫）",taxonomy:{domain:"真核域",kingdom:"原生生物界",phylum:"眼虫门",className:"眼虫纲",order:"眼虫目",family:"眼虫科",genus:"眼虫属"},era:"元古宙至今",geologicalPeriod:"元古宙",eraYears:"约 15 亿年前起",bodySize:"",description:'眼虫是"介于动物和植物之间"的经典教学材料——它有前端的红色眼点(感光)和鞭毛(游动)像动物，也有绿色叶绿体(光合)像植物。它的叶绿体是"三层膜的次级内共生"产物——先由一个非光合真核细胞吞入一个绿藻，绿藻此后逐渐降解、只留下三层膜包裹的叶绿体。缺光时它可以关闭光合、切换为异养。',shortBio:"眼点+鞭毛+叶绿体三合一——次级内共生的教科书案例，可自养可异养。",imagePath:"images/processed/Euglena_gracilis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["三层膜次级质体","红色眼点","自养/异养切换"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_protista_choice"],nextNodeId:""},node_dinoflagellate:{id:"node_dinoflagellate",type:"terminal",era:1,eraName:"元古宙至今",geologicalPeriod:"元古宙",yearsAgo:"约 10 亿年前起",requiredTime:0,species:{id:"species_noctiluca_scintillans",scientificName:"Noctiluca scintillans",commonName:"代表生物：夜光藻",taxonomy:{domain:"真核域",kingdom:"原生生物界",phylum:"甲藻门",className:"沟鞭藻纲",order:"夜光藻目",family:"夜光藻科",genus:"夜光藻属"},era:"元古宙至今",geologicalPeriod:"元古宙",eraYears:"约 10 亿年前起",bodySize:"",description:'沟鞭藻拥有两条位于赤道沟和纵沟的鞭毛，游动时像旋转的陀螺。夜光藻是最著名的赤潮生物——它受机械扰动时会发出蓝色荧光，海浪拍岸时形成夜晚的"荧光海"奇观。其它甲藻是造礁珊瑚体内的虫黄藻共生者(zooxanthella)，一旦白化(共生崩溃)珊瑚礁就死亡。',shortBio:"涡鞭陀螺 + 蓝色生物荧光——赤潮制造者与珊瑚共生藻的双面主角。",imagePath:"images/processed/Noctiluca_scintillans.jpg",imageWidth:0,imageHeight:0,keyInnovations:["沟鞭双鞭毛","生物荧光","与珊瑚共生"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_protista_choice"],nextNodeId:""},node_oomycete:{id:"node_oomycete",type:"terminal",era:1,eraName:"元古宙至今",geologicalPeriod:"元古宙",yearsAgo:"约 10 亿年前起",requiredTime:0,species:{id:"species_phytophthora_infestans",scientificName:"Phytophthora infestans",commonName:"代表生物：致病疫霉",taxonomy:{domain:"真核域",kingdom:"原生生物界",phylum:"卵菌门",className:"卵菌纲",order:"霜霉目",family:"腐霉科",genus:"疫霉属"},era:"元古宙至今",geologicalPeriod:"元古宙",eraYears:"约 10 亿年前起",bodySize:"",description:'卵菌看起来完全像真菌——同样长丝状菌丝、同样分泌酶消化寄主，但分子系统学揭示它属于 Stramenopiles(与硅藻同门)，是"趋同演化"最戏剧化的案例之一。致病疫霉引发的"马铃薯晚疫病"是 1845 年爱尔兰大饥荒的直接原因，饥荒饿死一百万人、逼走一百万人移民美国。它至今仍是全球农业头号威胁之一。',shortBio:"外表像真菌实为水生原虫——1845 年爱尔兰大饥荒的元凶。",imagePath:"images/processed/Phytophthora_infestans.jpg",imageWidth:0,imageHeight:0,keyInnovations:["菌丝趋同真菌","游动孢子","农业毁灭级病原"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_protista_choice"],nextNodeId:""},node_filasterea:{id:"node_filasterea",type:"terminal",era:1,eraName:"元古宙至今",geologicalPeriod:"元古宙",yearsAgo:"约 10 亿年前起",requiredTime:0,species:{id:"species_capsaspora_owczarzaki",scientificName:"Capsaspora owczarzaki",commonName:"代表生物：滤板虫",taxonomy:{domain:"真核域",kingdom:"原生生物界",phylum:"丝状伪足变形虫支（Filasterea，后鞭毛生物）",className:"Filasterea",order:"滤板虫目",family:"滤板虫科",genus:"滤板虫属"},era:"元古宙至今",geologicalPeriod:"元古宙",eraYears:"约 10 亿年前起",bodySize:"",description:'滤板虫最初在淡水螺 Biomphalaria 血液里发现——它能杀死曼氏血吸虫。基因组测序让科学家震惊：这种单细胞生物拥有大量本以为是"动物专有"的基因(整合素、酪氨酸激酶、转录因子)。它是动物起源研究的关键"活化石"，展示了"多细胞动物出现之前，工具箱已经准备好了"。它有单细胞、聚集体、囊胞三种形态，是"多细胞化前奏"的教科书案例。',shortBio:'螺血液里的"动物起源候补"——单细胞已带整套多细胞工具箱。',imagePath:"images/processed/Capsaspora_owczarzaki.jpg",imageWidth:0,imageHeight:0,keyInnovations:["整合素/激酶预演","多形态生活史","动物起源模型"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_opisthokont"],nextNodeId:""},node_cryptomycota:{id:"node_cryptomycota",type:"terminal",era:1,eraName:"元古宙至今",geologicalPeriod:"元古宙",yearsAgo:"约 10 亿年前起",requiredTime:0,species:{id:"species_rozella_allomycis",scientificName:"Rozella allomycis",commonName:"代表生物：罗塞拉虫",taxonomy:{domain:"真核域",kingdom:"真菌界",phylum:"隐真菌门",className:"隐真菌纲",order:"罗塞拉目",family:"罗塞拉科",genus:"罗塞拉属"},era:"元古宙至今",geologicalPeriod:"元古宙",eraYears:"约 10 亿年前起",bodySize:"",description:'罗塞拉是"真菌的基部姐妹"——2011 年的分子系统学重新分类发现它属于全新的隐真菌门(Cryptomycota)。它是壶菌的胞内寄生者，进入宿主后不产生几丁质细胞壁（这与所有典型真菌相反），只在胞质中吸收养分。它可能保留了真菌起源前"介于原生生物和真菌之间"的过渡形态，与微孢子虫是姐妹群。',shortBio:"真菌起源基部姐妹——寄生壶菌胞内，无几丁质壁，2011 年重新分类。",imagePath:"images/processed/Rozella_allomycis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["无几丁质细胞壁","胞内寄生真菌","真菌基部姐妹"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_opisthokont"],nextNodeId:""},node_chytrid:{id:"node_chytrid",type:"terminal",era:1,eraName:"元古宙至今",geologicalPeriod:"元古宙",yearsAgo:"约 10 亿年前起",requiredTime:0,species:{id:"species_batrachochytrium_dendrobatidis",scientificName:"Batrachochytrium dendrobatidis",commonName:"代表生物：蛙壶菌",taxonomy:{domain:"真核域",kingdom:"真菌界",phylum:"壶菌门",className:"壶菌纲",order:"壶菌目",family:"壶菌科",genus:"蛙壶菌属"},era:"元古宙至今",geologicalPeriod:"元古宙",eraYears:"约 10 亿年前起",bodySize:"",description:'壶菌门是唯一保留鞭毛游动孢子的真菌门——它们像原生生物一样在水中游动扩散，然后附着萌发出菌丝。蛙壶菌感染两栖类皮肤，扰乱皮肤呼吸和电解质平衡，被认为是"地球上单一病原造成生物多样性丧失最严重的案例"——已导致 500+ 两栖类物种衰退，其中 90+ 已灭绝，是全球两栖动物危机的核心元凶。',shortBio:"唯一带鞭毛的真菌门——蛙壶菌导致 90+ 两栖类物种灭绝。",imagePath:"images/processed/Batrachochytrium_dendrobatidis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["游动孢子","皮肤感染","大灭绝级病原"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_fungi_ancestor"],nextNodeId:""},node_glomeromycete:{id:"node_glomeromycete",type:"terminal",era:1,eraName:"奥陶纪至今",geologicalPeriod:"奥陶纪",yearsAgo:"约 4.6 亿年前起",requiredTime:0,species:{id:"species_rhizophagus_irregularis",scientificName:"Rhizophagus irregularis",commonName:"代表生物：不规则根孢囊霉",taxonomy:{domain:"真核域",kingdom:"真菌界",phylum:"球囊菌门",className:"球囊菌纲",order:"根孢囊霉目",family:"根孢囊霉科",genus:"根孢囊霉属"},era:"奥陶纪至今",geologicalPeriod:"奥陶纪",eraYears:"约 4.6 亿年前起",bodySize:"",description:'球囊菌门专营一件事：与植物根系形成丛枝菌根(AM)。菌丝穿入根皮层细胞、形成分支状的"树枝形吸器"，为植物运输磷元素、换取植物的糖分——这是地球上最古老、最广泛的共生关系，覆盖 80% 的陆生维管束植物。分子和化石证据表明，球囊菌与植物的共生 4.6 亿年前就与植物一起登陆，帮助了陆生植物的整场绿色革命。',shortBio:"陆生植物 80% 的根共生伙伴——4.6 亿年前一同登陆，撑起绿色革命。",imagePath:"images/processed/Rhizophagus_irregularis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["丛枝菌根(AM)","磷-糖交换共生","陆生植物共登陆"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_fungi_ancestor"],nextNodeId:""},node_microsporidia:{id:"node_microsporidia",type:"terminal",era:1,eraName:"元古宙至今",geologicalPeriod:"元古宙",yearsAgo:"约 5 亿年前起",requiredTime:0,species:{id:"species_encephalitozoon_cuniculi",scientificName:"Encephalitozoon cuniculi",commonName:"代表生物：兔脑微孢子虫",taxonomy:{domain:"真核域",kingdom:"真菌界",phylum:"微孢子虫门",className:"",order:"",family:"",genus:"脑孢虫属"},era:"元古宙至今",geologicalPeriod:"元古宙",eraYears:"约 5 亿年前起",bodySize:"",description:'微孢子虫是真菌里的极端简化专家——曾被认为是原生生物，2007 年后确认是真菌门的姐妹群或基部分支。它们完全丧失线粒体(只留 mitosome)、基因组仅约 2.9 Mb，是已知最小的真核基因组之一。它们的"极管"是自然界最精巧的注射装置：几微秒内像鱼叉一样弹射入宿主细胞，直接把孢子内容物注入胞内。免疫缺陷患者(HIV/器官移植)的重要机会性病原。',shortBio:"真菌里的注射鱼叉——极管几微秒弹射入宿主细胞，基因组仅约 2.9Mb。",imagePath:"images/processed/Encephalitozoon_cuniculi.jpg",imageWidth:0,imageHeight:0,keyInnovations:["极管弹射","极简基因组","细胞内寄生"],isExtinct:!1,animationCategory:"microbe"},prerequisites:["node_fungi_ancestor"],nextNodeId:""},node_rhodophyte:{id:"node_rhodophyte",type:"terminal",era:1,eraName:"元古宙至今",geologicalPeriod:"元古宙",yearsAgo:"约 12 亿年前起",requiredTime:0,species:{id:"species_porphyra_yezoensis",scientificName:"Neopyropia yezoensis",commonName:"代表生物：条斑紫菜",taxonomy:{domain:"真核域",kingdom:"植物界",phylum:"红藻门",className:"红毛菜纲",order:"红毛菜目",family:"红毛菜科",genus:"新紫菜属"},era:"元古宙至今",geologicalPeriod:"元古宙",eraYears:"约 12 亿年前起",bodySize:"",description:"红藻是 Archaeplastida 中最古老的分支之一——约 10.5 亿年前加拿大北极的亨特组地层已有多细胞红藻化石（Bangiomorpha，已知最早的可靠有性生殖化石记录）。红藻叶绿体保留了藻胆蛋白(藻红蛋白/藻蓝蛋白)，能吸收蓝绿光，是唯一能在真光层最深处(200 m)生存的多细胞光合生物。紫菜是全球消费量最大的可食用海藻，也是海苔寿司的原料。",shortBio:"最古老的多细胞光合生物之一——藻红蛋白吃深海蓝光，紫菜的原型。",imagePath:"images/processed/Neopyropia_yezoensis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["藻胆蛋白","深水光合","完全丧失鞭毛"],isExtinct:!1,animationCategory:"aquatic"},prerequisites:["node_plantae_ancestor"],nextNodeId:""},node_charophyte:{id:"node_charophyte",type:"terminal",era:1,eraName:"元古宙至今",geologicalPeriod:"元古宙",yearsAgo:"约 8 亿年前起",requiredTime:0,species:{id:"species_chara_vulgaris",scientificName:"Chara vulgaris",commonName:"代表生物：普通轮藻",taxonomy:{domain:"真核域",kingdom:"植物界",phylum:"链形植物门",className:"轮藻纲",order:"轮藻目",family:"轮藻科",genus:"轮藻属"},era:"元古宙至今",geologicalPeriod:"元古宙",eraYears:"约 8 亿年前起",bodySize:"",description:'轮藻是"最像陆生植物的水生藻"——细胞形成节间+轮生短枝的宏观植物体，具复杂的多细胞生殖器官(卵器 + 精子器)，甚至能钙化沉积产生化石。分子系统学现已确认双星藻纲(Zygnematophyceae)比轮藻更接近陆生植物，但轮藻仍是理解植物登陆前体制的关键参考。研究轮藻等于研究"植物即将登陆的前夜"。',shortBio:"登陆前夜的水中蓝本——节间轮枝+复杂生殖器官（现存最近近亲是双星藻纲）。",imagePath:"images/processed/Chara_vulgaris.jpg",imageWidth:0,imageHeight:0,keyInnovations:["节间轮枝","多细胞生殖器官","登陆前夜参照"],isExtinct:!1,animationCategory:"aquatic"},prerequisites:["node_plantae_ancestor"],nextNodeId:""},node_lycopod:{id:"node_lycopod",type:"terminal",era:2,eraName:"志留纪至今",geologicalPeriod:"志留纪",yearsAgo:"约 4.3 亿年前起",requiredTime:0,species:{id:"species_lycopodium_japonicum",scientificName:"Lycopodium japonicum",commonName:"代表生物：日本石松",taxonomy:{domain:"真核域",kingdom:"植物界",phylum:"石松门",className:"石松纲",order:"石松目",family:"石松科",genus:"石松属"},era:"志留纪至今",geologicalPeriod:"志留纪",eraYears:"约 4.3 亿年前起",bodySize:"",description:"石松是最早的维管束植物之一——志留纪就已经出现，石炭纪时它的近亲鳞木(Lepidodendron)高达 40 米、构成了地球第一片森林、埋藏形成了世界上大部分的煤层。现代石松已缩小为地面草本，但它保留的小型叶(microphyll)+ 二叉分枝+ 孢子囊穗结构，是维管束植物最原始的形态标志。",shortBio:"现存最原始维管束植物——石炭纪煤层的祖先，二叉分枝+小型叶。",imagePath:"images/processed/Lycopodium_japonicum.jpg",imageWidth:0,imageHeight:0,keyInnovations:["小型叶(microphyll)","二叉分枝","孢子囊穗"],isExtinct:!1,animationCategory:"plant"},prerequisites:["node_land_plant_choice"],nextNodeId:""},node_hornwort:{id:"node_hornwort",type:"terminal",era:2,eraName:"志留纪至今",geologicalPeriod:"志留纪",yearsAgo:"约 4.5 亿年前起",requiredTime:0,species:{id:"species_anthoceros_agrestis",scientificName:"Anthoceros agrestis",commonName:"代表生物：田角苔",taxonomy:{domain:"真核域",kingdom:"植物界",phylum:"角苔门",className:"角苔纲",order:"角苔目",family:"角苔科",genus:"角苔属"},era:"志留纪至今",geologicalPeriod:"志留纪",eraYears:"约 4.5 亿年前起",bodySize:"",description:"角苔是苔藓植物的三大门之一(藓类/苔类/角苔)，也是陆生植物中最独特的一支——它的孢子体是一根一根像小角一样竖立的绿色柱体，可以终生从基部持续生长（苔藓中独此一家：其它苔藓的孢子体成熟后即停止生长）。它还与蓝细菌 Nostoc 形成体内共生，直接固氮。分子系统学一度将它视为维管束植物最近的姐妹群。",shortBio:"苔藓三门之一——小角形孢子体持续生长，与蓝细菌固氮共生。",imagePath:"images/processed/Anthoceros_agrestis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["无限生长孢子体","与蓝细菌固氮共生","独立门"],isExtinct:!1,animationCategory:"plant"},prerequisites:["node_land_plant_choice"],nextNodeId:""},node_psilotum:{id:"node_psilotum",type:"terminal",era:2,eraName:"泥盆纪至今",geologicalPeriod:"泥盆纪",yearsAgo:"约 4 亿年前起",requiredTime:0,species:{id:"species_psilotum_nudum",scientificName:"Psilotum nudum",commonName:"代表生物：松叶蕨",taxonomy:{domain:"真核域",kingdom:"植物界",phylum:"真蕨门",className:"松叶蕨纲",order:"松叶蕨目",family:"松叶蕨科",genus:"松叶蕨属"},era:"泥盆纪至今",geologicalPeriod:"泥盆纪",eraYears:"约 4 亿年前起",bodySize:"",description:'松叶蕨是"活化石级"的真蕨——它没有真正的叶和根，只有二叉分枝的地上枝和地下的根状茎。这种极简结构一度被认为是最原始陆生植物(莱尼蕨)的直接后裔，但现代分子系统学显示它更可能是通过"次生简化"回到这种形态的真蕨。它至今仍常见于亚热带岩壁与树干。',shortBio:"无叶无根活化石——二叉分枝像 4 亿年前的莱尼蕨，实为次生简化。",imagePath:"images/processed/Psilotum_nudum.jpg",imageWidth:0,imageHeight:0,keyInnovations:["无叶无根","二叉分枝","次生简化"],isExtinct:!1,animationCategory:"plant"},prerequisites:["node_fern"],nextNodeId:""},node_ophioglossum:{id:"node_ophioglossum",type:"terminal",era:2,eraName:"泥盆纪至今",geologicalPeriod:"泥盆纪",yearsAgo:"约 3.5 亿年前起",requiredTime:0,species:{id:"species_ophioglossum_reticulatum",scientificName:"Ophioglossum reticulatum",commonName:"代表生物：瓶尔小草",taxonomy:{domain:"真核域",kingdom:"植物界",phylum:"真蕨门",className:"瓶尔小草纲",order:"瓶尔小草目",family:"瓶尔小草科",genus:"瓶尔小草属"},era:"泥盆纪至今",geologicalPeriod:"泥盆纪",eraYears:"约 3.5 亿年前起",bodySize:"",description:'瓶尔小草是"染色体最多的生物"之一——网状瓶尔小草(O. reticulatum)二倍体染色体数 2n=1260(n=630)，是已知最高记录之一。基因组的多轮全基因组复制(多倍化)让它成为植物演化领域最惊人的基因组案例。它的形态却极为简单：一片舌状营养叶+一根穗状孢子囊柄，像一支小勺插在地上。它的地下部与真菌共生。',shortBio:"染色体数世界之最(2n=1260)——多轮全基因组复制的极端案例。",imagePath:"images/processed/Ophioglossum_reticulatum.jpg",imageWidth:0,imageHeight:0,keyInnovations:["极端多倍化","简化叶片","真菌共生地下体"],isExtinct:!1,animationCategory:"plant"},prerequisites:["node_fern"],nextNodeId:""},node_gnetophyte:{id:"node_gnetophyte",type:"terminal",era:4,eraName:"二叠纪至今",geologicalPeriod:"二叠纪",yearsAgo:"约 2.6 亿年前起",requiredTime:0,species:{id:"species_welwitschia_mirabilis",scientificName:"Welwitschia mirabilis",commonName:"代表生物：百岁兰",taxonomy:{domain:"真核域",kingdom:"植物界",phylum:"麻黄门",className:"倪藤纲",order:"百岁兰目",family:"百岁兰科",genus:"百岁兰属"},era:"二叠纪至今",geologicalPeriod:"二叠纪",eraYears:"约 2.6 亿年前起",bodySize:"",description:'麻黄门是最"不像裸子植物"的裸子——它是唯一具有次级木质部导管(与被子植物趋同)的裸子植物，一度被认为是"被子植物的姐妹群"，但分子系统学最终把它塞回了裸子内部。百岁兰是麻黄门里最奇怪的一员：只有两片终生生长的带状叶片，从中央茎盘不断延展、不断被沙漠风撕裂，寿命可达 2000 年，是纳米比亚沙漠的"活化石怪物"。',shortBio:"两叶终生生长——寿命 2000 年的沙漠怪物，具趋同被子植物的导管。",imagePath:"images/processed/Welwitschia_mirabilis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["次级木质部导管","两叶终生生长","极端寿命"],isExtinct:!1,animationCategory:"plant"},prerequisites:["node_gymnosperm"],nextNodeId:""},node_pteridosperm:{id:"node_pteridosperm",type:"extinction",era:3,eraName:"石炭纪-白垩纪",geologicalPeriod:"石炭纪",yearsAgo:"约 3.6-0.8 亿年前",requiredTime:0,species:{id:"species_medullosa",scientificName:"Medullosa noei",commonName:"代表生物：髓木（种子蕨）",taxonomy:{domain:"真核域",kingdom:"植物界",phylum:"种子蕨门(灭绝)",className:"髓木纲",order:"髓木目",family:"髓木科",genus:"髓木属"},era:"石炭纪-白垩纪",geologicalPeriod:"石炭纪",eraYears:"约 3.6-0.8 亿年前",bodySize:"",description:'种子蕨是石炭纪-白垩纪重要的裸子植物类群，形态像蕨类(大型羽状复叶)但已发展出真正的种子——这让 19 世纪的古植物学家极度困惑，"看起来是蕨类却结种子"。它们是被子植物候补祖先假说(Anthophyte 假说)的源头之一，也是石炭纪煤沼森林的第二大类植物(仅次于石松鳞木)。全类群在白垩纪中期灭绝，仅留下丰富化石。',shortBio:"石炭纪煤沼森林第二主力——蕨状叶+真种子，白垩纪灭绝。",imagePath:"images/processed/Medullosa_noei.jpg",imageWidth:0,imageHeight:0,keyInnovations:["羽状复叶+种子","巨型茎干","煤沼森林主力"],isExtinct:!0,animationCategory:"plant"},prerequisites:["node_gymnosperm"],nextNodeId:"",extinctionNarrative:"髓木是石炭纪森林里高大的种子蕨，用种子繁殖却长得像蕨。石炭纪雨林崩溃、气候变干后，这类古老植物大批消失，煤层里还压着它们的身影。"},node_amborella:{id:"node_amborella",type:"terminal",era:5,eraName:"白垩纪至今",geologicalPeriod:"白垩纪",yearsAgo:"约 1.3 亿年前起",requiredTime:0,species:{id:"species_amborella_trichopoda",scientificName:"Amborella trichopoda",commonName:"代表生物：无油樟",taxonomy:{domain:"真核域",kingdom:"植物界",phylum:"被子植物门",className:"木兰纲",order:"无油樟目",family:"无油樟科",genus:"无油樟属"},era:"白垩纪至今",geologicalPeriod:"白垩纪",eraYears:"约 1.3 亿年前起",bodySize:"",description:'无油樟是所有其它被子植物的姐妹群——存活在新喀里多尼亚岛云雾林里的唯一一种。它保留了极为原始的性状：没有真正的导管(水分靠假导管)、雌雄异株、单孔花粉。基因组测序(2013)证实它是"重建被子植物祖先花与生理"的核心参考物种，是植物演化研究的"露西"。',shortBio:'所有被子植物的姐妹群——新喀里多尼亚孤悬活化石，被子演化的"露西"。',imagePath:"images/processed/Amborella_trichopoda.jpg",imageWidth:0,imageHeight:0,keyInnovations:["无真导管","雌雄异株","被子演化基线"],isExtinct:!1,animationCategory:"plant"},prerequisites:["node_angiosperm"],nextNodeId:""},node_magnoliid:{id:"node_magnoliid",type:"terminal",era:5,eraName:"白垩纪至今",geologicalPeriod:"白垩纪",yearsAgo:"约 1.2 亿年前起",requiredTime:0,species:{id:"species_magnolia_denudata",scientificName:"Magnolia denudata",commonName:"代表生物：白玉兰",taxonomy:{domain:"真核域",kingdom:"植物界",phylum:"被子植物门",className:"木兰纲",order:"木兰目",family:"木兰科",genus:"木兰属"},era:"白垩纪至今",geologicalPeriod:"白垩纪",eraYears:"约 1.2 亿年前起",bodySize:"",description:'木兰类是"古老的中心分支"——保留大量原始特征(未分化的花被、螺旋排列的多雄蕊、船形花瓣)，是被子植物演化早期的活见证。木兰花早在甲虫是主要传粉者的时代就已定型——花被厚实以防甲虫啃咬，散发浓香吸引甲虫钻入。同类还包括樟树、月桂、胡椒、鳄梨。',shortBio:"被子植物的中心古老支——花期与甲虫共演化，鳞片式花被抗虫啃。",imagePath:"images/processed/Magnolia_denudata.jpg",imageWidth:0,imageHeight:0,keyInnovations:["未分化花被","螺旋多雄蕊","甲虫传粉"],isExtinct:!1,animationCategory:"plant"},prerequisites:["node_angiosperm"],nextNodeId:""},node_placozoa:{id:"node_placozoa",type:"terminal",era:1,eraName:"埃迪卡拉纪至今",geologicalPeriod:"埃迪卡拉纪",yearsAgo:"约 6 亿年前起",requiredTime:0,species:{id:"species_trichoplax_adhaerens",scientificName:"Trichoplax adhaerens",commonName:"代表生物：丝盘虫",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"扁盘动物门",className:"",order:"",family:"扁盘虫科",genus:"扁盘虫属"},era:"埃迪卡拉纪至今",geologicalPeriod:"埃迪卡拉纪",eraYears:"约 6 亿年前起",bodySize:"",description:'丝盘虫是"最简单的动物"——一片直径 1-2 毫米、由 6 种细胞类型构成的扁平双层组织，没有嘴、没有神经、没有器官，靠腹面纤毛在浅海礁石上像变形虫一样爬行，用整个体腔外贴消化。它是扁盘动物门唯一被广泛记载的物种，基因组仅约 98 Mb，包含所有真动物基因家族的雏形，是"多细胞动物起源"的关键活化石。',shortBio:"最简单的动物——两层 6 种细胞的扁片，无嘴无神经，整体贴地消化。",imagePath:"images/processed/Trichoplax_adhaerens.jpg",imageWidth:0,imageHeight:0,keyInnovations:["两层组织","6 种细胞类型","外贴消化"],isExtinct:!1,animationCategory:"aquatic"},prerequisites:["node_animal_ancestor"],nextNodeId:""},node_ctenophore:{id:"node_ctenophore",type:"terminal",era:1,eraName:"埃迪卡拉纪至今",geologicalPeriod:"埃迪卡拉纪",yearsAgo:"约 6 亿年前起",requiredTime:0,species:{id:"species_mnemiopsis_leidyi",scientificName:"Mnemiopsis leidyi",commonName:"代表生物：淡海栉水母",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"栉水母动物门",className:"触手纲",order:"兜水母目",family:"兜水母科",genus:"兜水母属"},era:"埃迪卡拉纪至今",geologicalPeriod:"埃迪卡拉纪",eraYears:"约 6 亿年前起",bodySize:"",description:'栉水母以八列纤毛"梳板"划水——每条纤毛列在阳光下衍射出流动的彩虹光，是海洋中最优美的动物之一。栉水母是最早独立演化出神经系统的动物之一，但其神经/肌肉基因组成与刺胞动物+两侧对称动物差异极大，2013 年基因组研究提出"栉水母比海绵更基部"的争议假说，重塑了动物系统树的争论。淡海栉水母是入侵物种，1980 年代通过压舱水进入黑海，摧毁了当地渔业。',shortBio:"八列梳板划水+入侵种——争议中的最基部动物，纤毛衍射流动彩虹。",imagePath:"images/processed/Mnemiopsis_leidyi.jpg",imageWidth:0,imageHeight:0,keyInnovations:["纤毛梳板运动","独立神经系统起源","生物荧光"],isExtinct:!1,animationCategory:"aquatic"},prerequisites:["node_animal_ancestor"],nextNodeId:""},node_xenacoelomorph:{id:"node_xenacoelomorph",type:"terminal",era:1,eraName:"寒武纪至今",geologicalPeriod:"寒武纪",yearsAgo:"约 5.5 亿年前起",requiredTime:0,species:{id:"species_xenoturbella_bocki",scientificName:"Xenoturbella bocki",commonName:"代表生物：波氏无腔动物",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"异涡虫动物门",className:"无腔纲",order:"",family:"无腔动物科",genus:"无腔虫属"},era:"寒武纪至今",geologicalPeriod:"寒武纪",eraYears:"约 5.5 亿年前起",bodySize:"",description:'波氏无腔动物是"消失的过渡"——它只有一个体腔开口(既是嘴也是肛门)、没有专门的呼吸/循环/排泄器官，看起来比涡虫还要简单。多次被误分类为软体动物、扁形虫，直到 2011-2016 年分子系统学证据支持它是所有两侧对称动物的最基部姐妹群或后口动物的基部。它可能是"多细胞动物简化到极致后的模样"。',shortBio:"一孔进出无器官——两侧对称动物最基部姐妹群的争议候选。",imagePath:"images/processed/Xenoturbella_bocki.jpg",imageWidth:0,imageHeight:0,keyInnovations:["单一体腔开口","无专门器官","两侧对称基部"],isExtinct:!1,animationCategory:"aquatic"},prerequisites:["node_bilaterian"],nextNodeId:""},node_nemertea:{id:"node_nemertea",type:"terminal",era:1,eraName:"寒武纪至今",geologicalPeriod:"寒武纪",yearsAgo:"约 5.4 亿年前起",requiredTime:0,species:{id:"species_lineus_longissimus",scientificName:"Lineus longissimus",commonName:"代表生物：巨鞭纽虫",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"纽形动物门",className:"无针纲",order:"异纽目",family:"异纽科",genus:"纽虫属"},era:"寒武纪至今",geologicalPeriod:"寒武纪",eraYears:"约 5.4 亿年前起",bodySize:"",description:'纽形动物是"世界上最长的动物"——1864 年苏格兰海滩上冲上一条 55 米长的巨鞭纽虫标本(比蓝鲸还长)。它拥有一根伸缩自如的"翻吻"，可从头顶弹出、缠住猎物注入毒液(其中一种"anabaseine"是烟碱受体激动剂)。它是原口动物基部之外、独立发展出封闭循环系统与真体腔的重要一支。',shortBio:"世界最长动物(55m)——毒液翻吻猎手，独立起源的封闭循环。",imagePath:"images/processed/Lineus_longissimus.jpg",imageWidth:0,imageHeight:0,keyInnovations:["翻吻","封闭循环系统","极端体长"],isExtinct:!1,animationCategory:"aquatic"},prerequisites:["node_protostome"],nextNodeId:""},node_bryozoa:{id:"node_bryozoa",type:"terminal",era:2,eraName:"奥陶纪至今",geologicalPeriod:"奥陶纪",yearsAgo:"约 4.8 亿年前起",requiredTime:0,species:{id:"species_bugula_neritina",scientificName:"Bugula neritina",commonName:"代表生物：总合草苔虫",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"苔藓动物门",className:"裸唇纲",order:"唇口目",family:"总合草苔虫科",genus:"草苔虫属"},era:"奥陶纪至今",geologicalPeriod:"奥陶纪",eraYears:"约 4.8 亿年前起",bodySize:"",description:'苔藓动物是"动物做的珊瑚"——每个个体只有 0.5 毫米，但通过出芽形成分工明确的群体：有的负责摄食(用触手冠 lophophore 过滤海水)、有的负责防御(变形为鸟头形颚)、有的负责生殖。这种"社会性群体动物"独立于蚂蚁蜜蜂发展。总合草苔虫产生海洋抗癌先导化合物 bryostatin，是海洋药物研究的明星物种。',shortBio:"动物界的珊瑚+社会分工——群体分工过滤，抗癌先导化合物来源。",imagePath:"images/processed/Bugula_neritina.jpg",imageWidth:0,imageHeight:0,keyInnovations:["触手冠(lophophore)","群体分化","海洋药源"],isExtinct:!1,animationCategory:"aquatic"},prerequisites:["node_protostome"],nextNodeId:""},node_brachiopod:{id:"node_brachiopod",type:"terminal",era:2,eraName:"寒武纪至今",geologicalPeriod:"寒武纪",yearsAgo:"约 5.4 亿年前起",requiredTime:0,species:{id:"species_lingula_anatina",scientificName:"Lingula anatina",commonName:"代表生物：鸭嘴海豆芽",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"腕足动物门",className:"无铰纲",order:"海豆芽目",family:"海豆芽科",genus:"海豆芽属"},era:"寒武纪至今",geologicalPeriod:"寒武纪",eraYears:"约 5.4 亿年前起",bodySize:"",description:'腕足动物看起来像双壳类贝(两片壳)，但对称面完全不同——软体动物左右壳对称，腕足腹背壳对称。海豆芽用一根伸缩性肉茎(pedicle)锚定在沙泥中，退潮时把壳缩入洞里。它的化石记录（可追溯至奥陶纪甚至更早）与现代形态几乎无异，是"活化石"教科书案例——尽管基因组研究显示它从未停止分子层面的演化。奥陶-古生代腕足是海底优势类群，二叠纪末大灭绝后被双壳类取代。',shortBio:"5.4 亿年谱系延续的活化石——腹背壳对称+肉茎锚定，古生代海底王者。",imagePath:"images/processed/Lingula_anatina.jpg",imageWidth:0,imageHeight:0,keyInnovations:["腹背壳对称","肉茎锚定","古生代海底优势"],isExtinct:!1,animationCategory:"aquatic"},prerequisites:["node_protostome"],nextNodeId:""},node_tardigrade:{id:"node_tardigrade",type:"terminal",era:2,eraName:"寒武纪至今",geologicalPeriod:"寒武纪",yearsAgo:"约 5.2 亿年前起",requiredTime:0,species:{id:"species_hypsibius_dujardini",scientificName:"Hypsibius dujardini",commonName:"代表生物：迪氏杜氏熊虫",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"缓步动物门",className:"真缓步纲",order:"疣足目",family:"疣足熊虫科",genus:"疣足熊虫属"},era:"寒武纪至今",geologicalPeriod:"寒武纪",eraYears:"约 5.2 亿年前起",bodySize:"",description:'熊虫可能是地球上最"打不死"的动物——它能通过 tun(桶状) 隐生状态耐受 -272°C 到 +150°C、约 1000 倍人类致死辐射剂量、真空、乃至 2007 年 ESA 的 FOTON-M3 太空舱外暴露实验(10 天真空+紫外)。它的独门武器是"损伤抑制蛋白"(Dsup)，直接结合 DNA 保护其免受辐射断裂。它属于泛节肢动物(Panarthropoda)，是节肢动物的姐妹。',shortBio:"打不死的水熊——真空紫外都能挺过去，Dsup 蛋白裹住 DNA。",imagePath:"images/processed/Hypsibius_dujardini.jpg",imageWidth:0,imageHeight:0,keyInnovations:["tun 隐生状态","Dsup 保护蛋白","极端耐受性"],isExtinct:!1,animationCategory:"aquatic"},prerequisites:["node_protostome"],nextNodeId:""},node_myriapod:{id:"node_myriapod",type:"terminal",era:2,eraName:"志留纪至今",geologicalPeriod:"志留纪",yearsAgo:"约 4.2 亿年前起",requiredTime:0,species:{id:"species_scolopendra_subspinipes",scientificName:"Scolopendra subspinipes",commonName:"代表生物：少棘蜈蚣",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"节肢动物门",className:"唇足纲",order:"蜈蚣目",family:"蜈蚣科",genus:"蜈蚣属"},era:"志留纪至今",geologicalPeriod:"志留纪",eraYears:"约 4.2 亿年前起",bodySize:"",description:'多足亚门是"最先登陆的节肢动物"之一——志留纪的化石 Pneumodesmus newmani(4.2 亿年前苏格兰)是已知最早的呼吸空气的陆生动物之一。蜈蚣每个体节一对足、第一对足特化为毒颚(forcipules)、可注射蛋白酶+血清素类神经毒素。它们是热带雨林土壤中的顶级小型掠食者，也是地球上仍在辐射的类群。',shortBio:"最早登陆的节肢动物之一——每节一对足+毒颚，土壤顶级掠食者。",imagePath:"images/processed/Scolopendra_subspinipes.jpg",imageWidth:0,imageHeight:0,keyInnovations:["分节多足","空气呼吸(气管)","毒颚(forcipules)"],isExtinct:!1,animationCategory:"terrestrial"},prerequisites:["node_arthropod"],nextNodeId:""},node_trilobite:{id:"node_trilobite",type:"extinction",era:2,eraName:"寒武纪-二叠纪",geologicalPeriod:"寒武纪",yearsAgo:"约 5.2-2.52 亿年前",requiredTime:0,species:{id:"species_calymene_blumenbachii",scientificName:"Calymene blumenbachii",commonName:"代表生物：布氏隐头虫（三叶虫）",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"节肢动物门",className:"三叶虫纲(灭绝)",order:"镜眼虫目",family:"隐头虫科",genus:"隐头虫属"},era:"寒武纪-二叠纪",geologicalPeriod:"寒武纪",eraYears:"约 5.2-2.52 亿年前",bodySize:"",description:"三叶虫是古生代海底的绝对主角——从寒武纪早期爆发至二叠纪末灭绝，繁盛 2.7 亿年、留下 22000+ 个描述过的物种。它们是最早拥有真正复眼(方解石晶体透镜)的动物，一些三叶虫的复眼含有多达 15,000 个独立小眼。二叠纪末超级火山爆发引发的海洋酸化+缺氧终结了它们的时代——所有三叶虫在同一次事件中集体消失。",shortBio:"古生代海底之王——最早真复眼(方解石透镜)，二叠纪末灭绝。",imagePath:"images/processed/Calymene_blumenbachii.jpg",imageWidth:0,imageHeight:0,keyInnovations:["方解石透镜复眼","三叶身体分区","古生代主宰"],isExtinct:!0,animationCategory:"aquatic"},prerequisites:["node_arthropod"],nextNodeId:"",extinctionNarrative:'三叶虫在海洋里横行近三亿年，是古生代当之无愧的"活化石级"常客。然而二叠纪末那场终极大灭绝一视同仁，连这位老寿星也一同清零。'},node_eurypterid:{id:"node_eurypterid",type:"extinction",era:2,eraName:"奥陶纪-二叠纪",geologicalPeriod:"奥陶纪",yearsAgo:"约 4.6-2.52 亿年前",requiredTime:0,species:{id:"species_jaekelopterus_rhenaniae",scientificName:"Jaekelopterus rhenaniae",commonName:"代表生物：莱茵耶克尔鲎（海蝎子）",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"节肢动物门",className:"螯肢亚门 板足鲎目(灭绝)",order:"板足鲎目",family:"翼肢鲎科",genus:"耶克尔鲎属"},era:"奥陶纪-二叠纪",geologicalPeriod:"奥陶纪",eraYears:"约 4.6-2.52 亿年前",bodySize:"",description:"板足鲎(海蝎子)是史上最大的节肢动物——莱茵耶克尔鲎化石标本估计体长 2.5 米，是志留-泥盆纪海洋和淡水的顶级掠食者。它有一对巨型多刺前螯，能刺穿早期无颌鱼的皮肤。它属于螯肢亚门(与蛛形纲同属)而非真正的鲎，古生代末期与三叶虫一起灭绝。",shortBio:"史上最大节肢动物(2.5m)——志留-泥盆海洋顶级掠食者，古生代末灭绝。",imagePath:"images/processed/Jaekelopterus_rhenaniae.jpg",imageWidth:0,imageHeight:0,keyInnovations:["巨大体型(2.5m)","多刺前螯","水生顶级掠食"],isExtinct:!0,animationCategory:"aquatic"},prerequisites:["node_arthropod"],nextNodeId:"",extinctionNarrative:"耶克尔鲎又叫海蝎子，最大能长到两米半，是古生代海洋里令人胆寒的猎手。鱼类崛起后它节节败退，二叠纪末大灭绝为这支巨型节肢动物画上句号。"},node_chiton:{id:"node_chiton",type:"terminal",era:2,eraName:"寒武纪至今",geologicalPeriod:"寒武纪",yearsAgo:"约 5.4 亿年前起",requiredTime:0,species:{id:"species_acanthopleura_granulata",scientificName:"Acanthopleura granulata",commonName:"代表生物：花斑锉石鳖",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"软体动物门",className:"多板纲",order:"石鳖目",family:"石鳖科",genus:"花斑锉石鳖属"},era:"寒武纪至今",geologicalPeriod:"寒武纪",eraYears:"约 5.4 亿年前起",bodySize:"",description:'石鳖是"独立辐射了 5.4 亿年"的软体动物——它拥有 8 片背部铰接的壳板+锉刀般的齿舌(radula)。它的齿舌上牙齿含磁铁矿(Fe₃O₄)——是自然界最硬的生物矿化材料之一，用于刮食附着在岩石上的红藻。当被翻过来时它会像穿山甲一样卷起来保护腹足。石鳖的祖先可能保留了软体动物"多壳板原型"的最原始状态。',shortBio:"8 片壳板+磁铁矿齿舌——刮岩藻用的自然最硬牙齿，卷起自卫。",imagePath:"images/processed/Acanthopleura_granulata.jpg",imageWidth:0,imageHeight:0,keyInnovations:["8 片铰接壳板","磁铁矿齿舌","刮食适应"],isExtinct:!1,animationCategory:"aquatic"},prerequisites:["node_mollusk"],nextNodeId:""},node_monoplacophoran:{id:"node_monoplacophoran",type:"terminal",era:2,eraName:"寒武纪至今",geologicalPeriod:"寒武纪",yearsAgo:"约 5.2 亿年前起",requiredTime:0,species:{id:"species_neopilina_galatheae",scientificName:"Neopilina galatheae",commonName:"代表生物：加拉星新蝶贝",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"软体动物门",className:"单板纲",order:"",family:"新蝶贝科",genus:"新蝶贝属"},era:"寒武纪至今",geologicalPeriod:"寒武纪",eraYears:"约 5.2 亿年前起",bodySize:"",description:'单板纲被认为已灭绝 3.8 亿年——直到 1952 年"加拉德海"号科考船在哥斯达黎加外海 3590 米深处捞上一枚活体新蝶贝。它有一片斗笠状的单壳、8 对肌肉痕、5 对鳃、6 对肾——这种"体节重复"的解剖结构完全颠覆了此前"软体动物无体节"的教科书结论，暗示软体动物与环节动物的共同祖先可能是分节的。它是活化石的最戏剧化案例之一。',shortBio:"被认为灭绝 3.8 亿年的活化石——1952 年深海发现，体节重复颠覆教科书。",imagePath:"images/processed/Neopilina_galatheae.jpg",imageWidth:0,imageHeight:0,keyInnovations:["单一斗笠形壳","体节重复解剖","深海孑遗"],isExtinct:!1,animationCategory:"aquatic"},prerequisites:["node_mollusk"],nextNodeId:""},node_saccorhytus:{id:"node_saccorhytus",type:"extinction",era:2,eraName:"寒武纪",geologicalPeriod:"寒武纪",yearsAgo:"约 5.4 亿年前",requiredTime:0,species:{id:"species_saccorhytus_coronarius",scientificName:"Saccorhytus coronarius",commonName:"代表生物：冠状皱囊虫",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"两侧对称动物（分类未定）",className:"",order:"",family:"",genus:"皱囊虫属"},era:"寒武纪",geologicalPeriod:"寒武纪",eraYears:"约 5.4 亿年前",bodySize:"",description:"皱囊虫曾被认为是最早的后口动物，但 Liu et al. (2022, Nature) 重新分析后将其归为蜕皮动物（Ecdysozoa）——口周围的孔洞不是鳃裂而是刺状结构的基部。它是寒武纪早期微小的球形动物，仅约 1mm，有一个大口但无肛门。",shortBio:"原以为是后口动物祖先，现重归蜕皮动物。寒武早期微型球形动物，约1mm，有口无肛。",imagePath:"images/processed/Saccorhytus_coronarius.jpg",imageWidth:0,imageHeight:0,keyInnovations:["分类归属存疑","身体锥孔","寒武微化石"],isExtinct:!0,animationCategory:"aquatic"},prerequisites:["node_protostome"],nextNodeId:"",extinctionNarrative:"皱囊虫来自寒武纪早期，只有一毫米大，浑身褶皱、嘴巴巨大却没有肛门；它曾被当作后口动物大线上极早的一员，如今被重新归入蜕皮动物。这个奇特小生命早已消失在寒武纪。"},node_vetulicolia:{id:"node_vetulicolia",type:"extinction",era:2,eraName:"寒武纪",geologicalPeriod:"寒武纪",yearsAgo:"约 5.2 亿年前",requiredTime:0,species:{id:"species_vetulicola_cuneata",scientificName:"Vetulicola cuneata",commonName:"代表生物：楔形古虫",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"古虫动物门(灭绝)",className:"古虫纲",order:"古虫目",family:"古虫科",genus:"古虫属"},era:"寒武纪",geologicalPeriod:"寒武纪",eraYears:"约 5.2 亿年前",bodySize:"",description:'古虫动物是澄江生物群的明星——身体分为一个前部的"游泳桶"(带 5 对鳃裂开口)和一个后部的分节尾巴，看起来像"没有头的鲟鱼"。它们可能是"最早的后口动物之一"，代表了脊索动物起源之前的过渡形态——已经拥有鳃裂但还没有脊索。它们随寒武纪末的灭绝事件而消失，只在澄江页岩里保存了极其精细的化石。',shortBio:"寒武游泳桶——前段带鳃裂后段分节尾，脊索动物起源前的过渡形态。",imagePath:"images/processed/Vetulicola_cuneata.jpg",imageWidth:0,imageHeight:0,keyInnovations:["前段鳃裂桶","分节推进尾","早期后口过渡"],isExtinct:!0,animationCategory:"aquatic"},prerequisites:["node_deuterostome"],nextNodeId:"",extinctionNarrative:"古虫身体分成前后两截，长得像个会游泳的楔子，可能是后口动物极早期的一支。这个寒武纪的怪咖没有留下后代，只在化石里定格。"},node_haikouichthys:{id:"node_haikouichthys",type:"extinction",era:2,eraName:"寒武纪",geologicalPeriod:"寒武纪",yearsAgo:"约 5.18 亿年前",requiredTime:0,species:{id:"species_haikouichthys_ercaicunensis",scientificName:"Haikouichthys ercaicunensis",commonName:"代表生物：耳材村海口鱼",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"无颌总纲(基部)",order:"",family:"海口鱼科",genus:"海口鱼属"},era:"寒武纪",geologicalPeriod:"寒武纪",eraYears:"约 5.18 亿年前",bodySize:"",description:'海口鱼是"最早的脊椎动物候选"——2003 年在中国云南澄江生物群报道，5.18 亿年前的化石长约 2.5 cm，已经拥有明显的头部、眼、耳囊、软骨脊椎弧片以及肌节。它是通向"有头动物"演化关键一步的活见证，比传统认为的奥陶纪早期鱼类早了近 5000 万年。',shortBio:"最早脊椎动物候选——澄江化石 5.18 亿年前，已有头、眼与脊椎弧片。",imagePath:"images/processed/Haikouichthys_ercaicunensis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["头部+眼","软骨脊椎弧片","澄江化石群"],isExtinct:!0,animationCategory:"aquatic"},prerequisites:["node_vertebrate"],nextNodeId:"",extinctionNarrative:'海口鱼来自寒武纪早期，只有指甲盖大小，却可能已有原始的脊椎雏形，是"有头有脊"这条大线的起点之一。这个古老支系早已湮没在寒武纪的海泥里。'},node_placoderm:{id:"node_placoderm",type:"extinction",era:3,eraName:"志留纪-泥盆纪",geologicalPeriod:"志留纪",yearsAgo:"约 4.4-3.6 亿年前",requiredTime:0,species:{id:"species_dunkleosteus_terrelli",scientificName:"Dunkleosteus terrelli",commonName:"代表生物：邓氏鱼",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"盾皮鱼纲(灭绝)",order:"节甲鱼目",family:"邓氏鱼科",genus:"邓氏鱼属"},era:"志留纪-泥盆纪",geologicalPeriod:"志留纪",eraYears:"约 4.4-3.6 亿年前",bodySize:"",description:'盾皮鱼纲是最早的有颌脊椎动物之一——头颈部覆盖着厚重的骨板"盾甲"，泥盆纪的邓氏鱼近年估计体长约 4-6 米，颌骨闭合力可达 5000 牛以上，是当时海洋顶级掠食者。盾皮鱼的胎生化石(2008 年研究的"亲鱼"属 Materpiscis 化石带有脐带和胎儿)证明有颌脊椎动物的胎生早在 3.8 亿年前就已出现。所有盾皮鱼在泥盆纪末灭绝事件中消失。',shortBio:"泥盆纪海洋霸主——4-6m 骨甲鱼，最古老胎生脊椎动物化石。",imagePath:"images/processed/Dunkleosteus_terrelli.jpg",imageWidth:0,imageHeight:0,keyInnovations:["骨板盾甲","强力咬合","最早有颌胎生"],isExtinct:!0,animationCategory:"aquatic"},prerequisites:["node_gnathostome"],nextNodeId:"",extinctionNarrative:"邓氏鱼是泥盆纪的装甲巨鱼，没有真正的牙，靠锋利的骨板咬合，咬力惊人。称霸海洋数千万年后，它在泥盆纪晚期大灭绝中沉入海底。"},node_acanthodian:{id:"node_acanthodian",type:"extinction",era:3,eraName:"志留纪-二叠纪",geologicalPeriod:"志留纪",yearsAgo:"约 4.4-2.5 亿年前",requiredTime:0,species:{id:"species_climatius_reticulatus",scientificName:"Climatius reticulatus",commonName:"代表生物：锐棘鱼",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"棘鱼纲(灭绝)",order:"棘鱼目",family:"锐棘鱼科",genus:"锐棘鱼属"},era:"志留纪-二叠纪",geologicalPeriod:"志留纪",eraYears:"约 4.4-2.5 亿年前",bodySize:"",description:'棘鱼纲是最早的有颌鱼类之一——身上覆盖菱形硬鳞片，每一个鳍前面都有一根硬棘。它们在志留纪就已经出现，比软骨鱼和硬骨鱼的分化更早，一度被视为软骨鱼和硬骨鱼的姐妹群。近年形态学系统分析把它们放在软骨鱼总纲基部——即棘鱼可能是"鲨鱼的祖先"而非独立类群。它们在二叠纪末灭绝。',shortBio:"每鳍带硬棘的最早有颌鱼——2016 年新证据指向鲨鱼祖先，二叠纪末灭绝。",imagePath:"images/processed/Climatius_reticulatus.jpg",imageWidth:0,imageHeight:0,keyInnovations:["多硬棘鳍","菱形硬鳞","有颌鱼类基部"],isExtinct:!0,animationCategory:"aquatic"},prerequisites:["node_gnathostome"],nextNodeId:"",extinctionNarrative:"棘鱼类是最早长出上下颌的鱼之一，浑身包着防身的硬刺。可惜鲨鱼和硬骨鱼后来居上，它们从泥盆纪一路衰退，最终在二叠纪末大灭绝里彻底退场——刺再多，也挡不住时代。"},node_gar:{id:"node_gar",type:"terminal",era:3,eraName:"侏罗纪至今",geologicalPeriod:"侏罗纪",yearsAgo:"约 1.8 亿年前起",requiredTime:0,species:{id:"species_atractosteus_spatula",scientificName:"Atractosteus spatula",commonName:"代表生物：大鳄雀鳝",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"辐鳍鱼纲",order:"雀鳝目",family:"雀鳝科",genus:"大雀鳝属"},era:"侏罗纪至今",geologicalPeriod:"侏罗纪",eraYears:"约 1.8 亿年前起",bodySize:"",description:'雀鳝是"新鳍类基部活化石"——它保留了极为古老的菱形硬鳞(ganoid scale)——一种夹层结构：外层珐琅质、内层齿骨质，硬如钢板，让它几乎无天敌。大鳄雀鳝可达 3 米以上，是北美淡水最大掠食鱼之一，能在缺氧水中直接把鳔当肺呼吸空气。分子系统学显示雀鳝目与弓鳍鱼目一起构成新鳍类基部。',shortBio:"硬鳞活化石——菱形钢板级鳞片+空气呼吸鳔肺，北美 3m 淡水掠食者。",imagePath:"images/processed/Atractosteus_spatula.jpg",imageWidth:0,imageHeight:0,keyInnovations:["菱形硬鳞","鳔当肺呼吸","侏罗纪至今保守形态"],isExtinct:!1,animationCategory:"aquatic"},prerequisites:["node_actinopterygii"],nextNodeId:""},node_eel:{id:"node_eel",type:"terminal",era:4,eraName:"白垩纪至今",geologicalPeriod:"白垩纪",yearsAgo:"约 1 亿年前起",requiredTime:0,species:{id:"species_anguilla_japonica",scientificName:"Anguilla japonica",commonName:"代表生物：日本鳗鲡",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"辐鳍鱼纲",order:"鳗鲡目",family:"鳗鲡科",genus:"鳗鲡属"},era:"白垩纪至今",geologicalPeriod:"白垩纪",eraYears:"约 1 亿年前起",bodySize:"",description:"日本鳗鲡的一生是最极端的洄游谜团——它在马里亚纳海沟以西的深海产卵，孵化的柳叶状幼体(leptocephalus)乘北赤道流+黑潮漂流 6 个月抵达东亚淡水河口，变态为幼鳗溯河而上、生活 5-15 年，随后返回大洋深海产卵一次即死。它属于鳗鲡目——独立演化出蛇形体+胸腹鳍消失的辐鳍鱼群。",shortBio:"深海到淡水的极端洄游者——蛇形+柳叶幼体，一生一次繁殖即死。",imagePath:"images/processed/Anguilla_japonica.jpg",imageWidth:0,imageHeight:0,keyInnovations:["蛇形长条身体","柳叶幼体(leptocephalus)","极端跨海洋洄游"],isExtinct:!1,animationCategory:"aquatic"},prerequisites:["node_actinopterygii"],nextNodeId:""},node_eusthenopteron:{id:"node_eusthenopteron",type:"extinction",era:3,eraName:"泥盆纪",geologicalPeriod:"泥盆纪",yearsAgo:"约 3.85 亿年前",requiredTime:0,species:{id:"species_eusthenopteron_foordi",scientificName:"Eusthenopteron foordi",commonName:"代表生物：真掌鳍鱼",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"肉鳍鱼纲",order:"骨鳞鱼目(灭绝)",family:"骨鳞鱼科",genus:"真掌鳍鱼属"},era:"泥盆纪",geologicalPeriod:"泥盆纪",eraYears:"约 3.85 亿年前",bodySize:"",description:'真掌鳍鱼是"鱼类通往四足动物路上的经典化石"——1881 年加拿大魁北克 Miguasha 发现，泥盆纪晚期 3.85 亿年前。它的鳍骨结构已经与陆生脊椎动物同源：内侧的肱骨、桡骨、尺骨清晰可辨，肩带具备承重的雏形，但它仍是完全水生的鱼类，没有指骨、也没有前后肢的分化。它是"提塔利克鱼-棘螈"之前的关键过渡形态。',shortBio:"通往陆地的水中过渡——鳍骨已可辨肱桡尺，但还没有指头。",imagePath:"images/processed/Eusthenopteron_foordi.jpg",imageWidth:0,imageHeight:0,keyInnovations:["肱-桡-尺骨同源","承重肩带雏形","过渡化石"],isExtinct:!0,animationCategory:"aquatic"},prerequisites:["node_lobefin"],nextNodeId:"",extinctionNarrative:'真掌鳍鱼的鱼鳍里已藏着上臂、前臂的骨头雏形，是"鱼往陆地看"的经典标本。它本身仍是条彻底的鱼，这一支没上成岸就已消失。'},node_acanthostega:{id:"node_acanthostega",type:"extinction",era:3,eraName:"泥盆纪",geologicalPeriod:"泥盆纪",yearsAgo:"约 3.65 亿年前",requiredTime:0,species:{id:"species_acanthostega_gunnari",scientificName:"Acanthostega gunnari",commonName:"代表生物：棘螈",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"两栖纲基部(灭绝)",order:"",family:"棘螈科",genus:"棘螈属"},era:"泥盆纪",geologicalPeriod:"泥盆纪",eraYears:"约 3.65 亿年前",bodySize:"",description:'棘螈是"改写登陆时间线"的关键化石——1987 年英国剑桥大学 Jenny Clack 团队在东格陵兰发现的完整骨架显示它每只脚有 8 根指头(而不是 5 根)，鳃仍然功能齐全，四肢无法真正支撑陆地行走。它彻底颠覆了"手足登陆理论"——四肢不是为登陆演化出来的，而是在水中先出现，用于在浅水淤泥间抓握、爬行。它揭示了演化中"旧器官被借用来完成新功能"的原理（学界称为 exaptation，先适应）。',shortBio:'8 指的水中四足动物——1987 年发现改写"登陆理论"：四肢先在水中出现，后被借用来登陆。',imagePath:"images/processed/Acanthostega_gunnari.jpg",imageWidth:0,imageHeight:0,keyInnovations:["8 指多指","功能性鳃","水中先长四肢"],isExtinct:!0,animationCategory:"aquatic"},prerequisites:["node_tetrapod_choice"],nextNodeId:"",extinctionNarrative:'棘螈已长出四肢，脚趾却有八根，还带着鳃，是条不折不扣的"水陆两栖实习生"。它没能真正征服陆地，在泥盆纪晚期灭绝事件中掉了队，把上岸的荣耀留给了后来者。'},node_lepospondyl:{id:"node_lepospondyl",type:"extinction",era:3,eraName:"石炭纪-二叠纪",geologicalPeriod:"石炭纪",yearsAgo:"约 3.3-2.5 亿年前",requiredTime:0,species:{id:"species_diplocaulus_magnicornis",scientificName:"Diplocaulus magnicornis",commonName:"代表生物：笠头螈",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"壳椎亚纲(灭绝)",order:"游蛇螈目",family:"笠头螈科",genus:"笠头螈属"},era:"石炭纪-二叠纪",geologicalPeriod:"石炭纪",eraYears:"约 3.3-2.5 亿年前",bodySize:"",description:'双足螈是"最奇异的早期四足动物之一"——石炭纪-二叠纪的两栖纲祖近类，头骨演化成一个巨大的"回旋镖"形横宽三角，宽度可达身体长度的一半。这个头形一度被认为像"水翼"能提供上升力，让它在浅水中滑翔状游动，也可能作为拦阻捕食者的护具。壳椎亚纲(Lepospondyli)是与迷齿两栖类平行的一支侧演化，最终全部灭绝。',shortBio:"回旋镖头四足动物——石炭-二叠水中滑翔或防御，壳椎亚纲代表。",imagePath:"images/processed/Diplocaulus_magnicornis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["回旋镖形头骨","壳椎骨结构","水中侧扁滑翔"],isExtinct:!0,animationCategory:"aquatic"},prerequisites:["node_tetrapod_choice"],nextNodeId:"",extinctionNarrative:"双足螈脑袋长成回旋镖形状，宽得像滑翔翼，用途至今成谜。这支离奇的古两栖类在石炭—二叠纪之交走向灭绝，把谜题留给了后人。"},node_petrolacosaurus:{id:"node_petrolacosaurus",type:"extinction",era:3,eraName:"石炭纪晚期",geologicalPeriod:"石炭纪",yearsAgo:"约 3.02 亿年前",requiredTime:0,species:{id:"species_petrolacosaurus_kansensis",scientificName:"Petrolacosaurus kansensis",commonName:"代表生物：油页岩蜥",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"爬行纲(基部双孔类 灭绝)",order:"始鳄目",family:"油页岩蜥科",genus:"油页岩蜥属"},era:"石炭纪晚期",geologicalPeriod:"石炭纪",eraYears:"约 3.02 亿年前",bodySize:"",description:'油页岩蜥是"已知最早的双孔类"——它的头骨侧后方两侧各多出一对颞孔，成为后来所有蜥蜴、蛇、恐龙、鸟、鳄鱼共同的解剖标志。3.02 亿年前的它体长仅 40 cm，是一只沿石炭纪沼泽边缘捕食昆虫的敏捷小型爬行动物。化石证据把它放在通向"鳞龙+主龙"辐射的最基部。',shortBio:"最早双孔类爬行动物——40cm 沼泽昆虫猎手，蜥/蛇/龙/鸟的共同祖近类。",imagePath:"images/processed/Petrolacosaurus_kansensis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["双颞孔","轻巧爬行姿态","双孔类根基"],isExtinct:!0,animationCategory:"terrestrial"},prerequisites:["node_amniote"],nextNodeId:"",extinctionNarrative:'油页岩蜥是已知最早的双孔类爬行动物之一，头骨上开了两个孔——这道"设计"后来通向了恐龙与鸟。开创者本身却止步石炭纪，没能亲眼见证。'},node_mosasaur:{id:"node_mosasaur",type:"extinction",era:4,eraName:"白垩纪晚期",geologicalPeriod:"白垩纪",yearsAgo:"约 1-0.66 亿年前",requiredTime:0,species:{id:"species_mosasaurus_hoffmannii",scientificName:"Mosasaurus hoffmannii",commonName:"代表生物：霍夫曼沧龙",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"爬行纲 有鳞目(灭绝支)",order:"有鳞目",family:"沧龙科",genus:"沧龙属"},era:"白垩纪晚期",geologicalPeriod:"白垩纪",eraYears:"约 1-0.66 亿年前",bodySize:"",description:"沧龙是白垩纪晚期海洋顶级掠食者——它的直系祖先是陆生的小型蜥蜴，在白垩纪中期重返海洋，四肢演化成鳍状划桨、尾巴末端出现新月形叉。霍夫曼沧龙体长可达 17 米，是历史上最大的海洋爬行动物之一。形态证据显示它与现代蜥蜴（近于巨蜥类）+蛇同属有鳞目。K-Pg 大灭绝把所有沧龙一次性抹去。",shortBio:"白垩海洋霸主——17m 蜥蜴亲戚重返水中，K-Pg 灭绝抹去所有。",imagePath:"images/processed/Mosasaurus_hoffmannii.jpg",imageWidth:0,imageHeight:0,keyInnovations:["鳍状四肢","尾末新月叉","17m 海洋顶级"],isExtinct:!0,animationCategory:"aquatic"},prerequisites:["node_lepidosauromorph"],nextNodeId:"",extinctionNarrative:"沧龙是白垩纪海洋的终极霸主，桨状四肢加满口利齿，连鲨鱼都是它的点心。可当 K-Pg 小行星撞碎海洋食物链，这位海皇也随之谢幕。"},node_pterosaur:{id:"node_pterosaur",type:"extinction",era:4,eraName:"三叠纪-白垩纪",geologicalPeriod:"三叠纪晚期",yearsAgo:"约 2.3-0.66 亿年前",requiredTime:0,species:{id:"species_quetzalcoatlus_northropi",scientificName:"Quetzalcoatlus northropi",commonName:"代表生物：风神翼龙",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"爬行纲(灭绝)",order:"翼龙目",family:"神龙翼龙科",genus:"风神翼龙属"},era:"三叠纪-白垩纪",geologicalPeriod:"三叠纪晚期",eraYears:"约 2.3-0.66 亿年前",bodySize:"",description:"翼龙是脊椎动物首个真正实现动力飞行的类群——比鸟类早近 8000 万年。翼龙的翼膜由极度延长的第四指骨支撑，附着于身体侧面直到脚踝。风神翼龙翼展 10-11 米、站立高度接近长颈鹿(5-6 米)，是史上最大的飞行动物。它们与恐龙一起在 K-Pg 灭绝事件中消失，但它们并不是恐龙——是主龙类里独立飞向天空的另一支。",shortBio:"史上最大飞行动物——翼展 10m+，鸟类之前 8000 万年就飞上天。",imagePath:"images/processed/Quetzalcoatlus_northropi.jpg",imageWidth:0,imageHeight:0,keyInnovations:["第四指骨延长翼膜","动力飞行(鸟前)","10m 翼展"],isExtinct:!0,animationCategory:"flying"},prerequisites:["node_archosaur"],nextNodeId:"",extinctionNarrative:"风神翼龙站起来有长颈鹿那么高，翼展逾十米，是有史以来最大的飞行动物。可再大的翅膀也飞不过 K-Pg 那场浩劫，天空之王随白垩纪一同落幕。"},node_stegosaur:{id:"node_stegosaur",type:"extinction",era:4,eraName:"侏罗纪晚期",geologicalPeriod:"侏罗纪",yearsAgo:"约 1.55-1.45 亿年前",requiredTime:0,species:{id:"species_stegosaurus_stenops",scientificName:"Stegosaurus stenops",commonName:"代表生物：狭面剑龙",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"爬行纲(灭绝)",order:"鸟臀目",family:"剑龙科",genus:"剑龙属"},era:"侏罗纪晚期",geologicalPeriod:"侏罗纪",eraYears:"约 1.55-1.45 亿年前",bodySize:"",description:'剑龙是侏罗纪晚期的招牌鸟臀恐龙——背上两列交错的骨板+尾尖 4 根尖刺(thagomizer)。骨板内含丰富血管网络，可能兼具温度调节、性展示与视觉威慑功能。它脑容量仅约 80 克（李子大小，"胡桃大脑"是流传已久的夸张）、身体却有 5 吨，是"最小脑袋比"的恐龙。它们在侏罗-白垩之交灭绝，白垩纪主要由甲龙类接替其生态位。',shortBio:"两列骨板+尾刺 4 尖——脑容量仅约 80 克的 5 吨侏罗鸟臀。",imagePath:"images/processed/Stegosaurus_stenops.jpg",imageWidth:0,imageHeight:0,keyInnovations:["背部骨板","尾刺(thagomizer)","极小脑容量比"],isExtinct:!0,animationCategory:"terrestrial"},prerequisites:["node_ornithischia"],nextNodeId:"",extinctionNarrative:"剑龙背插骨板、尾带尖刺，脑子却只有李子大——身型如公交车，智商像仓鼠。它在白垩纪早期就已灭绝，没能等到恐龙时代的谢幕演出。"},node_ankylosaur:{id:"node_ankylosaur",type:"extinction",era:4,eraName:"白垩纪",geologicalPeriod:"白垩纪",yearsAgo:"约 1.25-0.66 亿年前",requiredTime:0,species:{id:"species_ankylosaurus_magniventris",scientificName:"Ankylosaurus magniventris",commonName:"代表生物：大腹甲龙",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"爬行纲(灭绝)",order:"鸟臀目",family:"甲龙科",genus:"甲龙属"},era:"白垩纪",geologicalPeriod:"白垩纪",eraYears:"约 1.25-0.66 亿年前",bodySize:"",description:'甲龙是"移动的坦克"——白垩纪晚期的极端装甲鸟臀恐龙，背腹全身覆盖矿化骨突和骨板，甚至眼睑都有骨盾保护，尾巴末端演化成沉重的骨槌。它们与鳄鱼、恐龙、翼龙、沧龙一起在 K-Pg 大灭绝事件中消失。近年 CT 扫描发现它们的鼻腔盘绕成弯曲通道，可能起降温+扩大共鸣的作用。',shortBio:"移动坦克——全身骨甲+尾骨槌，白垩装甲鸟臀，K-Pg 灭绝。",imagePath:"images/processed/Ankylosaurus_magniventris.jpg",imageWidth:0,imageHeight:0,keyInnovations:["全身骨甲","尾骨槌","鼻腔盘绕通道"],isExtinct:!0,animationCategory:"terrestrial"},prerequisites:["node_ornithischia"],nextNodeId:"",extinctionNarrative:"甲龙浑身披甲、尾巴带锤，堪称白垩纪的移动坦克。可惜再厚的装甲也防不住天上砸下来的小行星——6600 万年前那场 K-Pg 大灭绝，坦克也得熄火。"},node_pelycosaur:{id:"node_pelycosaur",type:"extinction",era:3,eraName:"二叠纪",geologicalPeriod:"二叠纪早期",yearsAgo:"约 2.95-2.72 亿年前",requiredTime:0,species:{id:"species_dimetrodon_grandis",scientificName:"Dimetrodon grandis",commonName:"代表生物：大异齿龙",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"合弓纲(基部盘龙 灭绝)",order:"盘龙目",family:"异齿龙科",genus:"异齿龙属"},era:"二叠纪",geologicalPeriod:"二叠纪早期",eraYears:"约 3-2.72 亿年前",bodySize:"",description:'异齿龙是"看起来像恐龙但其实是我们祖先"的经典案例——它属于合弓纲的基部盘龙目，是二叠纪早期陆地顶级掠食者。它的招牌是背上一面由脊椎神经棘支撑的巨大"帆状结构"，起温度调节/性展示作用。它拥有已经开始分化的异型齿(刀齿+尖齿)，是"哺乳类祖先"路上的第一批可辨识特征。它比第一只恐龙早约 5000 万年出现，且已经完全灭绝。',shortBio:"不是恐龙的哺乳祖先——背帆+异型齿，二叠陆地霸主，早于恐龙 5000 万年。",imagePath:"images/processed/Dimetrodon_grandis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["背帆调温展示","异型齿分化","合弓纲基部"],isExtinct:!0,animationCategory:"terrestrial"},prerequisites:["node_synapsid"],nextNodeId:"",extinctionNarrative:"异齿龙背上撑着醒目的大帆，用来调节体温或求偶——注意，它是合弓类，跟恐龙半毛钱关系没有，反倒是我们哺乳类的远房长辈。这支盘龙类在二叠纪中期便已退场。"},node_caseid:{id:"node_caseid",type:"extinction",era:3,eraName:"二叠纪",geologicalPeriod:"二叠纪",yearsAgo:"约 2.85-2.6 亿年前",requiredTime:0,species:{id:"species_cotylorhynchus_romeri",scientificName:"Cotylorhynchus romeri",commonName:"代表生物：罗默杯鼻龙",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"合弓纲(基部 灭绝)",order:"盘龙目",family:"卡色龙科",genus:"杯鼻龙属"},era:"二叠纪",geologicalPeriod:"二叠纪",eraYears:"约 2.85-2.6 亿年前",bodySize:"",description:'杯鼻龙是"最早的巨型植食脊椎动物"之一——身长可达 4-6 米（属内最大种）、体重可达 2 吨，头骨相比身体却小得可爱(仅 25cm)。它的宽大肋骨拱起可能装载了发酵植物纤维的巨大内脏，是"发酵桶式植食"最早的四足代表。卡色龙类是与异齿龙平行的合弓纲基部支系，中二叠世被兽孔类取代，属于"我们祖先旁边的路"。',shortBio:"最早巨型植食脊椎——6m 大发酵桶配小头，合弓基部旁支。",imagePath:"images/processed/Cotylorhynchus_romeri.jpg",imageWidth:0,imageHeight:0,keyInnovations:["最早巨型植食","发酵桶体腔","头小身大"],isExtinct:!0,animationCategory:"terrestrial"},prerequisites:["node_synapsid"],nextNodeId:"",extinctionNarrative:"杯鼻龙脑袋小得可笑、肚子却圆滚滚，是二叠纪最早尝试吃素的大块头之一。它属于合弓纲的早期旁支，在二叠纪的动荡中没能坚持到最后。"},node_thrinaxodon:{id:"node_thrinaxodon",type:"extinction",era:4,eraName:"三叠纪早期",geologicalPeriod:"三叠纪",yearsAgo:"约 2.5-2.4 亿年前",requiredTime:0,species:{id:"species_thrinaxodon_liorhinus",scientificName:"Thrinaxodon liorhinus",commonName:"代表生物：光滑三尖齿兽",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"合弓纲(犬齿兽 灭绝)",order:"犬齿兽目",family:"三尖齿兽科",genus:"三尖齿兽属"},era:"三叠纪早期",geologicalPeriod:"三叠纪",eraYears:"约 2.5-2.4 亿年前",bodySize:"",description:'三尖齿兽是"哺乳类特征爆发的活教材"——2.5 亿年前刚熬过二叠纪末大灭绝的它，已同时具有三尖形颊齿、次生腭(硬腭)、蹲坐姿势、可能存在的胡须与洞穴育幼行为(2017 年报道的多具幼体同穴群居化石)。它属于犬齿兽目基部，与后来的哺乳形巨齿类同属"通向哺乳类"路径。',shortBio:"哺乳特征爆发的活教材——三尖颊齿+硬腭+洞穴育幼，2.5 亿年前。",imagePath:"images/processed/Thrinaxodon_liorhinus.jpg",imageWidth:0,imageHeight:0,keyInnovations:["三尖颊齿","次生腭","洞穴育幼"],isExtinct:!0,animationCategory:"terrestrial"},prerequisites:["node_cynodont"],nextNodeId:"",extinctionNarrative:"三尖齿兽是熬过二叠纪末大灭绝的幸运儿，会打洞、可能已有胡须，离哺乳动物只差一步。它这一支最终仍走向灭绝，接力棒交给了别的近亲。"},node_multituberculate:{id:"node_multituberculate",type:"extinction",era:4,eraName:"侏罗纪-始新世",geologicalPeriod:"侏罗纪",yearsAgo:"约 1.6-0.35 亿年前",requiredTime:0,species:{id:"species_ptilodus_montanus",scientificName:"Ptilodus montanus",commonName:"代表生物：山地翼齿兽",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲(灭绝)",order:"多瘤齿兽目",family:"翼齿兽科",genus:"翼齿兽属"},era:"侏罗纪-始新世",geologicalPeriod:"侏罗纪",eraYears:"约 1.6-0.35 亿年前",bodySize:"",description:'多瘤齿兽是"存续时间最长的哺乳类"——1.6 亿年前起在侏罗晚期出现，一直繁盛到始新世(3500 万年前)才灭绝，比人属(Homo)全部演化史长几十倍。它们臼齿上有多列瘤状齿突，专门磨碎植物种子和坚果；后肢结构像树松鼠，能在森林树冠间跳跃。它们的生态位后来被啮齿动物取代。虽被视为哺乳类，但已属"哺乳类演化的旁支"，不在通向真兽亚纲的路径上。',shortBio:"存续 1.25 亿年的哺乳侧支——翼齿磨种子+松鼠攀树，被啮齿类接替。",imagePath:"images/processed/Ptilodus_montanus.jpg",imageWidth:0,imageHeight:0,keyInnovations:["多瘤磨齿","树上跳跃","存续时间最长哺乳类"],isExtinct:!0,animationCategory:"terrestrial"},prerequisites:["node_mammaliaform"],nextNodeId:"",extinctionNarrative:'多瘤齿兽是"史上最成功的哺乳动物"之一，靠着一口高效的牙齿风光了上亿年。可当啮齿类（老鼠们）登场，它在竞争中败下阵来，于始新世末黯然退场。'},node_docodont:{id:"node_docodont",type:"extinction",era:4,eraName:"侏罗纪",geologicalPeriod:"侏罗纪",yearsAgo:"约 1.6-1.45 亿年前",requiredTime:0,species:{id:"species_castorocauda_lutrasimilis",scientificName:"Castorocauda lutrasimilis",commonName:"代表生物：獭形狸尾兽",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳形类(灭绝)",order:"柱齿兽目",family:"短齿兽科",genus:"狸尾兽属"},era:"侏罗纪",geologicalPeriod:"侏罗纪",eraYears:"约 1.6-1.45 亿年前",bodySize:"",description:'狸尾兽是"改写中生代哺乳形类刻板印象"的化石——2006 年中国内蒙古 1.6 亿年前的化石标本身上保留了毛发、扁桨状尾、脚蹼、水生鱼食牙齿，全长 42cm。它证明侏罗纪的"哺乳类祖近类"不都是躲在恐龙脚下瑟瑟发抖的小虫子——已有部分演化出水獭般的水生生态。柱齿兽目是完整哺乳纲之外的哺乳形侧支，与我们的祖先在侏罗纪就已分开。',shortBio:'侏罗纪的"水獭"——毛+桨尾+蹼脚+鱼食牙，改写"哺乳祖先都是小虫"的老印象。',imagePath:"images/processed/Castorocauda_lutrasimilis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["毛发化石","扁桨状尾","侏罗纪水生哺乳形"],isExtinct:!0,animationCategory:"aquatic"},prerequisites:["node_mammaliaform"],nextNodeId:"",extinctionNarrative:'狸尾兽像水獭一样会游泳、有蹼有鳞尾，颠覆了"早期哺乳类都是地面小老鼠"的偏见。它属于哺乳形类的旁支，热闹一阵便退出了舞台。'},node_haramiyidan:{id:"node_haramiyidan",type:"extinction",era:4,eraName:"三叠纪-白垩纪",geologicalPeriod:"三叠纪",yearsAgo:"约 2-1 亿年前",requiredTime:0,species:{id:"species_arboroharamiya_jenkinsi",scientificName:"Arboroharamiya jenkinsi",commonName:"代表生物：詹氏树贼兽",taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳形类(灭绝)",order:"贼兽目",family:"树贼兽科",genus:"树贼兽属"},era:"三叠纪-白垩纪",geologicalPeriod:"三叠纪",eraYears:"约 2-1 亿年前",bodySize:"",description:'贼兽是"最早会滑翔的哺乳形类"——2013 年中国辽宁 1.6 亿年前的化石标本保留了完整的骨骼与皮膜印痕，前后肢之间清晰可见滑翔膜(patagium)。它比蝙蝠的飞行早了 1 亿年，是哺乳形类对空中生态位最早的一次成功尝试。贼兽目是与柱齿兽平行的哺乳形侧支，不在通向真正哺乳纲的路径上。',shortBio:"中生代滑翔哺乳形——1.6 亿年前皮膜滑翔松鼠，比蝙蝠早 1 亿年上天。",imagePath:"images/processed/Arboroharamiya_jenkinsi.jpg",imageWidth:0,imageHeight:0,keyInnovations:["滑翔皮膜","树栖攀跃","中生代空中生态位"],isExtinct:!0,animationCategory:"flying"},prerequisites:["node_mammaliaform"],nextNodeId:"",extinctionNarrative:"树贼兽是侏罗纪会滑翔的小型哺乳形动物，四肢间可能张着皮膜。它是哺乳类黎明前的一次大胆尝试，最终没能延续下去。"},node_adapiform:{id:"node_adapiform",type:"extinction",era:5,eraName:"始新世",geologicalPeriod:"始新世",yearsAgo:"约 5500-3400 万年前",requiredTime:1440,species:{taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲",order:"灵长目",family:"假熊猴科",genus:"假熊猴属"},imagePath:"images/processed/Notharctus_tenebrosus.jpg",imageWidth:0,imageHeight:0,keyInnovations:["树栖果食","长尾平衡","眼窝后棒","湿鼻猴干群"],isExtinct:!0,animationCategory:"extinct",id:"species_notharctus_tenebrosus",scientificName:"Notharctus tenebrosus",commonName:"代表生物：假熊猴",era:"始新世",geologicalPeriod:"始新世",eraYears:"约 5000-3800 万年前",description:'假熊猴属于灭绝的假熊猴型（Adapiformes），是狐猴与懒猴系（Strepsirrhini）的干群近亲。北美与欧洲始新世森林的树栖果食者，前肢发达、尾长善攀。曾一度被热炒为人类祖先候选（2009 年的"艾达"Darwinius 化石风波），但形态学与分子学最终将它归入湿鼻猴系。',shortBio:"始新世北美 · 类狐猴假熊猴 —— 湿鼻猴系干群，曾被误认作人类祖先。"},prerequisites:["node_primate"],nextNodeId:"",extinctionNarrative:"假熊猴是始新世温暖森林里的早期灵长类。始新世末全球骤然变冷，森林萎缩，这支旁系没能挺过去——它更像现代狐猴的远亲，而非你我的直系祖先。"},node_plesiadapiform:{id:"node_plesiadapiform",type:"extinction",era:4,eraName:"古新世",geologicalPeriod:"古新世",yearsAgo:"约 6500-5500 万年前",requiredTime:1440,species:{taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲",order:"灵长目",family:"更猴科",genus:"更猴属"},imagePath:"images/processed/Plesiadapis_cookei.jpg",imageWidth:0,imageHeight:0,keyInnovations:["灵长干群","啮咬式门齿","爪而非甲","K-Pg 后辐射"],isExtinct:!0,animationCategory:"extinct",id:"species_plesiadapis_cookei",scientificName:"Plesiadapis cookei",commonName:"代表生物：更猴",era:"古新世",geologicalPeriod:"古新世",eraYears:"约 5800-5500 万年前",description:"更猴（Plesiadapiformes）是灵长目干群中最早的一支，形似松鼠：无立体视觉、有爪而非甲、门齿啮咬式。它们代表着灵长类刚从原始真兽类中分化时的形态——为后来的树栖抓握与视觉主导演化铺路。K-Pg 灭绝后曾是北美最繁盛的中型哺乳类之一，始新世被真正的灵长类取代。",shortBio:"古新世更猴 —— 灵长目最早干群，松鼠外形、爪非甲、门齿啮咬。"},prerequisites:["node_primate"],nextNodeId:"",extinctionNarrative:"更猴像松鼠又像灵长类，是灵长目黎明前的近亲。始新世的气候与竞争把这一支淘汰出局，真正的灵长类另辟蹊径。"},node_aegyptopithecus:{id:"node_aegyptopithecus",type:"extinction",era:5,eraName:"渐新世",geologicalPeriod:"渐新世",yearsAgo:"约 3000-2900 万年前",requiredTime:1440,species:{taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲",order:"灵长目",family:"原上猿科",genus:"埃及古猿属"},imagePath:"images/processed/Aegyptopithecus_zeuxis.jpg",imageWidth:0,imageHeight:0,keyInnovations:["狭鼻猴干群","脑体比提升","树栖果食","性二态显著"],isExtinct:!0,animationCategory:"extinct",id:"species_aegyptopithecus_zeuxis",scientificName:"Aegyptopithecus zeuxis",commonName:"代表生物：埃及古猿",era:"渐新世",geologicalPeriod:"渐新世",eraYears:"约 3000-2900 万年前",description:'埃及古猿是狭鼻猴类（Catarrhini）的早期干群代表，出土于埃及法尤姆矿区。体重仅 6-7 kg，树栖果食，脑体比已高于同时代其它灵长。它属于"猿-旧世界猴共同祖先"的形态谱系——具备猿类骨骼特征但尾巴尚存。',shortBio:"渐新世法尤姆 · 埃及古猿 —— 狭鼻猴类干群，猿+旧世界猴的共同祖先型。"},prerequisites:["node_simian"],nextNodeId:"",extinctionNarrative:"埃及古猿生活在渐新世的非洲雨林，是猴与猿分家前的老前辈。气候变迁与栖息地更替中，这一支渐渐淡出，只在化石里留下一张圆脸。"},node_parapithecus:{id:"node_parapithecus",type:"extinction",era:5,eraName:"渐新世",geologicalPeriod:"渐新世",yearsAgo:"约 3020-2950 万年前",requiredTime:1440,species:{taxonomy:{domain:"真核域",kingdom:"动物界",phylum:"脊索动物门",className:"哺乳纲",order:"灵长目",family:"副猿科",genus:"亚辟猴属（Apidium）"},imagePath:"images/processed/Apidium_phiomense.jpg",imageWidth:0,imageHeight:0,keyInnovations:["最古老类人猴","树栖跳跃","3.1.3.3 齿式","群居果食"],isExtinct:!0,animationCategory:"extinct",id:"species_apidium_phiomense",scientificName:"Apidium phiomens
